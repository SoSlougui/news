<script>
const ARTICLES = [{"id": "guerre-au-moyen-orient-l-iran-juge-inutile-de-po", "cat": "general", "catLabel": "G\u00e9n\u00e9ral", "title": "Guerre au Moyen-Orient\u00a0: l'Iran juge \"inutile de poursuivre\" les pourparlers avec les Etats-Unis \"si\" les engagements ne sont pas tenus", "excerpt": "La perspective d'un accord est-elle menac\u00e9e entre Washington et T\u00e9h\u00e9ran ? _\"Si vous n'avez ni la volont\u00e9 ni la capacit\u00e9 de tenir vos engagements, il est inutile de parler de poursuivre dans cette voie\"_, a lanc\u00e9 sur X l'influent pr\u00e9sident du Parlement iranien, Mohammad Bagher Ghalibaf, apr\u00e8s des frappes isra\u00e9liennes sur le sud de Beyrouth. _\"L'agression\"_ de Tsahal contre la banlieue sud de la capitale libanaise _\"a une fois de plus d\u00e9montr\u00e9 que les Etats-Unis n'ont soit pas la volont\u00e9 de respecter leurs engagements, soit pas la capacit\u00e9 de le faire\"_, a d\u00e9plor\u00e9 Mohammad Bagher Ghalibaf, n\u00e9gociateur dans les pourparlers avec les Etats-Unis. L'Iran conditionne tout accord \u00e0 un cessez-le-feu complet, y compris au Liban. Suivez notre direct. *   **Trois morts dans des frappes dans le sud de Beyrouth.**Isra\u00ebl a annonc\u00e9 des frappes _\"dans le quartier de la Dahiy\u00e9, \u00e0 Beyrouth (...), en r\u00e9ponse aux tirs du Hezbollah en direction du territoire isra\u00e9lien\"_, a d\u00e9clar\u00e9 le Premier ministre, Benyamin N\u00e9tanyahou, dans un bref communiqu\u00e9 conjoint avec le ministre de la D\u00e9fense, Isra\u00ebl Katz. De son c\u00f4t\u00e9, l'agence nationale d'information libanaise a annonc\u00e9 une frappe \u00e0 Ghobeiry, un des faubourgs sud de Beyrouth. Trois personnes ont \u00e9t\u00e9 tu\u00e9es. *   **Isra\u00ebl lance de nouveaux appels \u00e0 \u00e9vacuer plusieurs localit\u00e9s dans le sud du Liban.** L'arm\u00e9e isra\u00e9lienne a \u00e9mis dimanche matin deux ordres d'\u00e9vacuation visant une trentaine de villages du sud du Liban, avant des frappes pr\u00e9vues contre la milice chiite. Le porte-parole de l'arm\u00e9e en langue arabe, le colonel Avichay Adraee, a publi\u00e9 sur X deux messages successifs, dont le second concernait des localit\u00e9s situ\u00e9es au nord du fleuve Zahrani. *   **Le \"Charles-de-Gaulle\" reste \"sur zone jusqu'\u00e0 nouvel ordre\".**Alors que certains m\u00e9dias \u00e9voquent le d\u00e9part du porte-avions fran\u00e7ais de la M\u00e9diterran\u00e9e orientale pour subir une op\u00e9ration de maintenance \u00e0 Toulon, le chef d'\u00e9tat-major des Arm\u00e9es a d\u00e9menti cette information. _\"Le_ Charles-de-Gaulle _reste sur zone jusqu'\u00e0 nouvel ordre. Aucune d\u00e9cision n'a \u00e9t\u00e9 prise dans un autre sens\",_ a d\u00e9clar\u00e9 Fabien Mandon, dimanche sur franceinfo._\"Tout b\u00e2timent de la Marine nationale est soumis \u00e0 un plan de maintenance et des \u00e9ch\u00e9ances techniques, mais celles-ci peuvent \u00eatre retard\u00e9es et les contingences op\u00e9rationnelles priment\",_ a-t-il d\u00e9clar\u00e9, rappelant que _\"la France est particuli\u00e8rement impliqu\u00e9e dans le maintien de la libert\u00e9 de navigation\"_ dans la r\u00e9gion. *   **Le flou subsiste sur la signature d'un accord entre T\u00e9h\u00e9ran et Washington**._\"La R\u00e9publique islamique d'Iran n'a pas encore pris ni annonc\u00e9 sa d\u00e9cision finale concernant le protocole d'accord propos\u00e9 lors des n\u00e9gociations\"_, a \u00e9crit l'agence iranienne Fars, dimanche 14 juin, citant _\"une source bien inform\u00e9e proche de l'\u00e9quipe de n\u00e9gociation\"_ iranienne. R\u00e9put\u00e9 proche des milieux conservateurs, le m\u00e9dia contredit ainsi les d\u00e9clarations du pr\u00e9sident am\u00e9ricain, Donald Trump, convaincu qu'un terrain d'entente sera trouv\u00e9 dimanche sur un protocole d'accord permettant de mettre fin au conflit en cours au Moyen-Orient depuis le 28 f\u00e9vrier. *   !Image 2 Il y a 0 sec  #MOYEN_ORIENT Le principal n\u00e9gociateur iranien accuse les Etats-Unis de ne pas \"respecter leurs engagements\" apr\u00e8s des frappes isra\u00e9liennes sur le sud de Beyrouth, qui risquent de compromettre, selon lui, les pourparlers entre T\u00e9h\u00e9ran et Washington. Suivez notre direct. *   !Image 3 Il y a 0 sec  #MOYEN_ORIENT Le Liban a annonc\u00e9 avoir saisi l'ONU, accusant Isra\u00ebl d'avoir pulv\u00e9ris\u00e9 du glyphosate, un puissant herbicide, \u00e0 des niveaux \u00e9lev\u00e9s \u00e0 sa fronti\u00e8re en f\u00e9vrier, selon un communiqu\u00e9 du minist\u00e8re des Affaires \u00e9trang\u00e8res. Une lettre a \u00e9t\u00e9 adress\u00e9e au Conseil de s\u00e9curit\u00e9 de l'ONU et \u00e0 son secr\u00e9taire g\u00e9n\u00e9ral pour se plaindre de l'incident, survenu avant le d\u00e9but de la guerre entre Isra\u00ebl et le Hezbollah le 2 mars. Suivez notre direct. *   !Image 4 Il y a 0 sec  #MOYEN_ORIENT Trois corps ont \u00e9t\u00e9 d\u00e9gag\u00e9s des d\u00e9combres, tandis que \"six bless\u00e9s\" ont \u00e9t\u00e9 hospitalis\u00e9s \u00e0 la suite d'une frappe isra\u00e9lienne \u00e0 Ghobeiry, fief du Hezbollah, rapporte la d\u00e9fense civile dans un communiqu\u00e9. Plus t\u00f4t aujourd'hui, Isra\u00ebl a dit avoir men\u00e9 un bombardement \"avec pr\u00e9cision\" sur les faubourgs sud de la capitale libanaise, en repr\u00e9sailles \u00e0 des tirs du mouvement pro-iranien sur le nord de son territoire. *   !Image 5 Il y a 0 sec  #MOYEN_ORIENT Trois personnes ont \u00e9t\u00e9 tu\u00e9es, selon la d\u00e9fense civile libanaise, dans une frappe isra\u00e9lienne sur un quartier de la banlieue sud de Beyrouth. *   !Image 6 Il y a 0 sec  #G7 Donald Trump et son homologue Abdel Fattah al-Sissi vont s'entretenir en marge du sommet du G7 qui s'ouvre demain en France, annonce la pr\u00e9sidence \u00e9gyptienne. De m\u00eame source, les discussions porteront sur \"la mani\u00e8re de r\u00e9soudre les crises g\u00e9opolitiques internationales et de r\u00e9pondre \u00e0 leurs effets sur le commerce, l'\u00e9nergie et les cha\u00eenes d'approvisionnement\", dans le contexte des pourparlers pour mettre fin \u00e0 la guerre au Moyen-Orient. #MOYEN_ORIENT *   !Image 7 Il y a 0 sec  #MOYEN_ORIENT Isra\u00ebl rapporte avoir men\u00e9 des frappes sur la banlieue sud de Beyrouth, consid\u00e9r\u00e9e comme un bastion du groupe arm\u00e9 pro-iranien Hezbollah, tandis qu'un m\u00e9dia officiel libanais a fait \u00e9tat d'un bombardement sur le quartier de Ghobeiry. Suivez notre direct. *   !Image 8 Il y a 0 sec  On fait le point sur l'actualit\u00e9 ! \u2022 #MOYEN_ORIENT Donald Trump a affirm\u00e9 que les \u00c9tats-Unis signeraient aujourd'hui un accord avec l'Iran pour mettre fin \u00e0 la guerre au Moyen-Orient. Mais l'agence de presse iranienne Fars, r\u00e9put\u00e9e proche des milieux conservateurs, a affirm\u00e9 que T\u00e9h\u00e9ran n'avait pas encore pris de d\u00e9cision pour la signature du protocole d'accord. Suivez notre direct. \u2022 #BAC Le ministre de l'\u00c9ducation Edouard Geffray ne souhaite plus que des examens de fin d'ann\u00e9e, type baccalaur\u00e9at, soient organis\u00e9s l'apr\u00e8s-midi \u00e0 l'avenir, en raison du r\u00e9chauffement climatique. *   !Image 9 le chef d'\u00e9tat-major des Arm\u00e9es Il y a 0 sec  \"Le Charles-de-Gaulle reste sur zone jusqu\u2019\u00e0 nouvel ordre. Aucune d\u00e9cision n\u2019a \u00e9t\u00e9 prise dans un autre sens.\" #MOYEN_ORIENT Le chef d'\u00e9tat-major des Arm\u00e9es donne des nouvelles, sur franceinfo, du porte-avions fran\u00e7ais Charles-de-Gaulle, qui positionn\u00e9 depuis le mois de mars en M\u00e9diterran\u00e9e orientale. *   !Image 10 Il y a 0 sec  #MOYEN_ORIENT L'agence de presse iranienne Fars, r\u00e9put\u00e9e proche des milieux conservateurs, affirme que l'Iran \"n'a pas encore pris ni annonc\u00e9 sa d\u00e9cision\" pour la signature du protocole d'accord en discussion avec les Etats-Unis pour mettre fin \u00e0 la guerre au Moyen-Orient. *   !Image 11 Il y a 0 sec  #MOYEN_ORIENT#FOO sra\u00e9lienne, \u00e0 Beyrouth, le 14\u00a0juin 2026. L\u2019arm\u00e9e libanaisant fermant l\u2019acc\u00e8s au site de la frappe isra\u00e9lienne, \u00e0 Beyrouth, le 14 juin 2026. ZOHRA BENSEMRA/REUTERS Trois personnes ont \u00e9t\u00e9 tu\u00e9es et au moins six autres bless\u00e9es, selon la d\u00e9fense civile libanaise, dans un bombardement isra\u00e9lien sur le quartier de Ghobeiry, situ\u00e9 dans la banlieue sud de Beyrouth, o\u00f9 Isra\u00ebl dit avoir vis\u00e9 un centre de commandement du Hezbollah. > Isra\u00ebl bombarde le Liban juste avant la possible conclusion d\u2019un accord entre les \u00c9tats-Unis et l\u2019Iran, et ce n\u2019est pas la premi\u00e8re fois qu\u2019une escalade militaire survient \u00e0 un moment diplomatiquement sensible. Peut-on penser qu\u2019il existe une volont\u00e9 de compliquer, voire de saboter, les n\u00e9gociations entre Washington et T\u00e9h\u00e9ran ? Sans s\u2019avancer sur les motivations isra\u00e9liennes, dont le bombardement de la banlieue sud de Beyrouth est justifi\u00e9 par l\u2019Etat h\u00e9breu par des excursions a\u00e9riennes venant du Liban et attribu\u00e9es au Hezbollah, ces frappes pourraient effectivement menacer la signature d\u2019un protocole d\u2019accord pour mettre fin \u00e0 la guerre au Moyen-Orient que Donald Trump a annonc\u00e9 pour dimanche. Car l\u2019Iran a d\u00e9j\u00e0 pr\u00e9venu Isra\u00ebl que viser la capitale libanaise constituait une ligne rouge, argument qui avait \u00e9t\u00e9 utilis\u00e9 pour justifier des tirs de missiles contre l\u2019Etat h\u00e9breu il y a une semaine. Toutefois, des divergences strat\u00e9giques et d\u2019int\u00e9r\u00eats entre les Etats-Unis et Isra\u00ebl suscitent des frictions entre MM. Trump et N\u00e9tanyahou, malgr\u00e9 leur longue relation personnelle et politique. Le pr\u00e9sident am\u00e9ricain a eu un \u00e9change muscl\u00e9, truff\u00e9 d\u2019injures, lors d\u2019une conversation t\u00e9l\u00e9phonique avec Benyamin N\u00e9tanyahou. _Axios_ a cit\u00e9, le 1 er juin, un \u200cresponsable anonyme selon lequel Donald Trump \u200caurait lanc\u00e9 \u00e0 Benyamin N\u00e9tanyahou, au t\u00e9l\u00e9phone: _\u00abTu es un putain de \u200ccingl\u00e9. Sans moi, tu \u200bserais en prison. Je te sauve les fesses. Tout le monde te d\u00e9teste \u00e0 pr\u00e9sent. Tout le monde d\u00e9teste \u200cIsra\u00ebl \u00e0 cause de \u00e7a.\u00bb_ D\u00e9menti outrag\u00e9 dans l\u2019entourage du dirigeant isra\u00e9lien. Sur un podcast, deux jours plus tard, le pr\u00e9sident am\u00e9ricain confirmait pourtant la teneur du propos: _\u00abJ\u2019\u00e9tais un peu perturb\u00e9 par le fait qu\u2019il bataille constamment au Liban.\u00bb_ Le point sur la situation dimanche 14 juin \u00e0 14 heures *   **Apr\u00e8s avoir signal\u00e9 dimanche matin trois tirs de drones depuis le Liban sur le nord de son territoire \u2013 qui n\u2019ont pas fait de victime \u2013, Isra\u00ebl a annonc\u00e9 dimanche avoir men\u00e9 des frappes sur la banlieue sud de Beyrouth**, consid\u00e9r\u00e9e comme un bastion du groupe arm\u00e9 pro-iranien Hezbollah. Un m\u00e9dia officiel libanais a fait \u00e9tat d\u2019un bombardement \u00e0 Ghobeiry. **> L\u2019arm\u00e9e a effectu\u00e9 des frappes _\u00abdans la Dahiy\u00e9_[dans la banlieue sud de] _Beyrouth_(...)_en r\u00e9ponse aux tirs du Hezbollah en direction du territoire isra\u00e9lien\u00bb_, a d\u00e9clar\u00e9 le premier ministre isra\u00e9lien, Benyamin N\u00e9tanyahou,** dans un bref communiqu\u00e9 conjoint avec le ministre de la d\u00e9fense, Israel Katz, confirm\u00e9 par l\u2019arm\u00e9e, ajoutant que _\u00abIsra\u00ebl ne tol\u00e9rera_[it]_aucune attaque sur son territoire\u00bb_. **> L\u2019Iran a d\u00e9j\u00e0 pr\u00e9venu Isra\u00ebl que viser la capitale libanaise constituait une ligne rouge**, justifiant ainsi des tirs de missiles contre l\u2019Etat h\u00e9breu il y a une semaine. *   **Donald Trump a affirm\u00e9 que les Etats-Unis signeraient dimanche un accord avec l\u2019Iran** pour mettre fin \u00e0 la guerre au Moyen-Orient et pr\u00e9voyant la r\u00e9ouverture imm\u00e9diate du d\u00e9troit d\u2019Ormuz, **une information non confirm\u00e9e \u00e0 ce stade par T\u00e9h\u00e9ran**. *   **Une d\u00e9l\u00e9gation du Qatar, pays participant aux efforts de m\u00e9diation aux c\u00f4t\u00e9s du Pakistan, est arriv\u00e9e dimanche \u00e0 T\u00e9h\u00e9ran** selon les m\u00e9dias iraniens et un diplomate. Sur _Le Monde_ aujourd\u2019hui D\u00e9couvrez les articles les plus lus par nos abonn\u00e9s Frappes isra\u00e9liennes sur Beyrouth: \u00aben r\u00e9ponse aux tirs du Hezbollah en direction du territoire isra\u00e9lien\u00bb, dit Benyamin N\u00e9tanyahou L\u2019arm\u00e9e a effectu\u00e9 des frappes _\u00abdans la Dahiy\u00e9_ [dans la banlieue sud de] _Beyrouth_ (\u2026)_en r\u00e9ponse aux tirs du Hezbollah en direction du territoire isra\u00e9lien\u00bb_, a d\u00e9clar\u00e9 le premier ministre isra\u00e9lien, Benyamin N\u00e9tanyahou, dans un bref communiqu\u00e9 conjoint avec le ministre de la d\u00e9fense, Israel Katz, confirm\u00e9 par l\u2019arm\u00e9e, ajoutant qu\u2019_\u00abIsra\u00ebl ne tol\u00e9rera_[it]_aucune attaque sur son territoire\u00bb_. De son c\u00f4t\u00e9, l\u2019ANI, l\u2019agence nationale d\u2019information officielle libanaise, a annonc\u00e9 une frappe \u00e0 Ghobeiry, au sud de la capitale libanaise, tandis qu\u2019un correspondant de l\u2019AFP a rapport\u00e9 avoir entendu des explosions en provenance de cette zone. L\u2019arm\u00e9e isra\u00e9lienne frappe la banlieue sud de Beyrouth sans avertissement !Image 3: Sur le site de la frappe a\u00e9rienne isra\u00e9lienne qui a cibl\u00e9 un b\u00e2timent dans la banlieue sud de Beyrouth, le 14\u00a0juin 2026. Sur le site de la frappe a\u00e9rienne isra\u00e9lienne qui a cibl\u00e9 un b\u00e2timent dans la banlieue sud de Beyrouth, le 14 juin 2026. IBRAHIM AMRO/AFP Une frappe isra\u00e9lienne s\u2019est abattue sur la banlieue sud de Beyrouth, \u00e0 Ghobeiry, rapporte le m\u00e9dia_L\u2019Orient-Le Jour_. L\u2019agence Tsanim cite elle certaines sources affirmant que _\u00abplusieurs missiles ont frapp\u00e9 la place Al-Ghadir dans la Dahiy\u00e9_[dans la banlieue sud de]_Beyrouth\u00bb_. L\u2019arm\u00e9e isra\u00e9lienne a annonc\u00e9 ensuite dans un message sur Telegram avoir cibl\u00e9 des _\u00abinfrastructures du Hezbollah dans la banlieue sud de Beyrouth\u00bb_. \u00abUne signature \u00e9lectronique dimanche\u00bb, selon plusieurs m\u00e9dias Alors que des m\u00e9diateurs qataris se sont rendus \u00e0 T\u00e9h\u00e9ran dimanche pour finaliser un accord pr\u00e9liminaire, Associated Press rapporte les propos de _\u00abresponsables pakistanais et r\u00e9gionaux proches des n\u00e9gociations en cours, qui ont requis l\u2019anonymat\u00bb_, selon lesquels l\u2019Iran et les Etats-Unis se seraient _\u00abrapproch\u00e9s d\u2019un accord\u00bb_. Le premier ministre pakistanais, Shehbaz Sharif, a pour sa part dit que les deux parties \u00e9taient convenues d\u2019un protocole d\u2019accord et qu\u2019Islamabad se pr\u00e9parait _\u00ab\u00e0 une signature \u00e9lectronique dimanche\u00bb_, rapporte l\u2019agence Reuters. _\u00abUn accord sign\u00e9 \u00e9lectroniquement, sans c\u00e9r\u00e9monie en pr\u00e9sentiel, m\u00eame si l\u2019on ignore encore quand et comment la signature aura lieu\u00bb_, donne encore comme d\u00e9tails Associated Press, rappelant que les questions nucl\u00e9aires notamment n\u2019\u00e9taient pas finalis\u00e9es. Des sources ont aussi confirm\u00e9 \u00e0 la cha\u00eene Al-Arabiya que _\u00ables d\u00e9l\u00e9gations am\u00e9ricaine et iranienne tiendr_[aie]_nt une r\u00e9union virtuelle aujourd\u2019hui pour signer l\u2019accord de paix, une r\u00e9union qui se d\u00e9roulera en pr\u00e9sence des Etats m\u00e9diateurs, le Pakistan et le Qatar\u00bb_, pr\u00e9cise le m\u00e9dia saoudien. Plus t\u00f4t ce matin, l\u2019agence de presse iranienne Fars, citant une source, rapportait que la d\u00e9cision d\u00e9finitive de \u2060T\u00e9h\u00e9ran concernant un \u00e9ventuel accord-cadre avec les Etats-Unis \u00e9tait officiellement toujours en cours d\u2019examen. Un troisi\u00e8me drone tir\u00e9 du Liban frappe le territoire isra\u00e9lien, selon l\u2019arm\u00e9e isra\u00e9lienne L\u2019arm\u00e9e isra\u00e9lienne a annonc\u00e9 dimanche \u00e0 deux reprises que le territoire isra\u00e9lien avait \u00e9t\u00e9 la cible de drones tir\u00e9s du Liban, sans faire de victimes, alors qu\u2019un accord de paix au Moyen-Orient est pr\u00e9sent\u00e9 comme imminent. Apr\u00e8s une premi\u00e8re annonce faisant \u00e9tat de deux impacts constat\u00e9s dans le nord d\u2019Isra\u00ebl, _\u00abpr\u00e8s de la fronti\u00e8re avec le Liban\u00bb_, l\u2019arm\u00e9e isra\u00e9lienne a d\u00e9clar\u00e9 qu\u2019un nouveau tir avait provoqu\u00e9 un autre impact sur le territoire isra\u00e9lien. *    Tous nos articles, vid\u00e9os, podcasts et newsletters *    L\u2019application La Matinale du _Monde_, d\u00e8s 7 heures, la s\u00e9lection d\u2019articles par la r\u00e9daction *    Le quotidien en version num\u00e9rique d\u00e8s 13 heures Un m\u00e9dia iranien affirme que T\u00e9h\u00e9ran n\u2019a \u00abpas encore pris de d\u00e9cision finale\u00bb pour un accord _\u00abLa R\u00e9publique islamique d\u2019Iran n\u2019a pas encore pris ni annonc\u00e9 sa d\u00e9cision finale concernant le protocole d\u2019accord propos\u00e9 lors des n\u00e9gociations\u00bb_, a \u00e9crit dimanche l\u2019agence de presse iranienne FARS, citant une _\u00abune source bien inform\u00e9e proche de l\u2019\u00e9quipe de n\u00e9gociation\u00bb_ iranienne. La possibilit\u00e9 d\u2019un tel r\u00e8glement suscite l\u2019opposition de certains ultraconservateurs, hostiles \u00e0 des concessions, notamment sur le contr\u00f4le du strat\u00e9gique d\u00e9troit d\u2019Ormuz, de facto bloqu\u00e9 par l\u2019Iran depuis le d\u00e9but de la guerre. Vers l\u2019accord de paix: des divergences et un calendrier incertain Depuis l\u2019entr\u00e9e en vigueur d\u2019un cessez-le-feu le 8 avril, Washington et T\u00e9h\u00e9ran cherchent un accord, mais les n\u00e9gociations ont achopp\u00e9 sur de nombreux points: programme nucl\u00e9aire iranien, contr\u00f4le du d\u00e9troit d\u2019Ormuz (crucial pour le commerce mondial d\u2019hydrocarbures ou d\u2019engrais agricoles), lev\u00e9e des sanctions visant T\u00e9h\u00e9ran ou encore inclusion du Liban. Selon le chef de la diplomatie iranienne, Abbas Araghchi, le texte discut\u00e9 pr\u00e9voit la lev\u00e9e du blocus am\u00e9ricain des ports iraniens et une nouvelle gestion du d\u00e9troit d\u2019Ormuz, contr\u00f4l\u00e9 par T\u00e9h\u00e9ran depuis le d\u00e9but de la guerre. Selon Donald Trump cette nuit, les Iraniens, qui d\u00e9mentent vouloir se doter de l\u2019arme atomique comme les en accusent les Etats-Unis et Isra\u00ebl, _\u00abne veulent plus d\u2019arme nucl\u00e9aire\u00bb_. Les Etats-Unis iront _\u00abquand tout sera calme_ (\u2026)_r\u00e9cup\u00e9rer la poussi\u00e8re nucl\u00e9aire, enfouie profond\u00e9ment\u00bb_ afin de la diluer et de la d\u00e9truire _\u00aben Iran ou aux Etats-Unis\u00bb_, a-t-il ajout\u00e9 dans son message post\u00e9 sur Truth Social. Deux drones tir\u00e9s depuis le Liban frappent en territoire isra\u00e9lien _\u00abA la suite d\u2019alertes d\u00e9clench\u00e9es, il y a peu, concernant l\u2019infiltration d\u2019un a\u00e9ronef ennemi\u00bb_, a d\u00e9clar\u00e9 dimanche l\u2019arm\u00e9e isra\u00e9lienne, _\u00abdeux impacts_(\u2026)_ont \u00e9t\u00e9 identifi\u00e9s sur le territoire de l\u2019Etat d\u2019Isra\u00ebl\u00bb_. Deux ministres isra\u00e9liens d\u2019extr\u00eame droite, membres du cabinet de s\u00e9curit\u00e9, ont ensuite appel\u00e9 \u00e0 des attaques de repr\u00e9sailles sur la banlieue sud de Beyrouth, bastion du Hezbollah pro-iranien connu sous le nom de Dahiy\u00e9. _\u00abLes tirs sur les localit\u00e9s du Nord mettent \u00e0 l\u2019\u00e9preuve la doctrine de Dahiy\u00e9 d\u00e9clar\u00e9e par le premier ministre. Je l\u2019appelle \u00e0 l\u2019appliquer avec d\u00e9termination et fermet\u00e9, et \u00e0 d\u00e9truire des b\u00e2timents \u00e0 Dahiy\u00e9\u00bb_, a d\u00e9clar\u00e9 sur X le ministre des finances, Bezalel Smotrich. Le ministre de la s\u00e9curit\u00e9 nationale, Itamar ben Gvir, \u00e9galement membre de l\u2019ultradroite isra\u00e9lienne, a, pour sa part, \u00e9crit sur X: _\u00abPour chaque drone, un missile; pour chaque violation, feu; pour chaque drone, Dahiy\u00e9 doit trembler.\u00bb_ Benyamin N\u00e9tanyahou a averti ces derniers jours qu\u2019Isra\u00ebl n\u2019h\u00e9siterait pas \u00e0 frapper la banlieue sud de Beyrouth en cas de tirs du Hezbollah, pro-iranien, sur des localit\u00e9s du nord d\u2019Isra\u00ebl, une \u00e9quation qui, selon lui, est appuy\u00e9e par Washington. L\u2019arm\u00e9e isra\u00e9lienne \u00e9met des ordres d\u2019\u00e9vacuation pour une quinzaine de villages du sud du Liban !Image 4: Explosion \u00e0 la suite d\u2019une frappe isra\u00e9lienne, \u00e0 Nabatiy\u00e9, dans le sud du Liban, le 13\u00a0juin\u00a02026. Explosion \u00e0 la suite d\u2019une frappe isra\u00e9lienne, \u00e0 Nabatiy\u00e9, dans le sud du Liban, le 13 juin 2026. REUTERS L\u2019arm\u00e9e isra\u00e9lienne a annonc\u00e9, dimanche, qu\u2019elle s\u2019appr\u00eatait \u00e0 mener des frappes, visant selon elle le mouvement islamiste Hezbollah, sur la r\u00e9gion de Nabatiy\u00e9, dans le sud du Liban. _\u00abA la lumi\u00e8re de la violation par le Hezbollah de l\u2019accord de cessez-le-feu, l\u2019arm\u00e9e de d\u00e9fense est oblig\u00e9e d\u2019agir avec force contre lui\u00bb_, a d\u00e9clar\u00e9 le colonel Avichay Adraee, porte-parole arabophone de l\u2019arm\u00e9e isra\u00e9lienne. Il a appel\u00e9 la population \u00e0 \u00e9vacuer une quinzaine de villes et villages. _\u00ab_(\u2026)_Pour votre s\u00e9curit\u00e9, vous devez \u00e9vacuer imm\u00e9diatement vos maisons et vous \u00e9loigner des villages et des villes d\u2019une distance d\u2019au moins 1 000 m\u00e8tres vers des terrains ouverts.\u00bb_ Une d\u00e9l\u00e9gation du Qatar, pays m\u00e9diateur avec le Pakistan entre l\u2019Iran et les Etats-Unis, est arriv\u00e9e \u00e0 T\u00e9h\u00e9ran D\u2019apr\u00e8s l\u2019agence d\u2019information iranienne ISNA, un conseiller du ministre des affaires \u00e9trang\u00e8res du Qatar a \u00e9t\u00e9 d\u00e9p\u00each\u00e9 en Iran. Cette visite est destin\u00e9e \u00e0 _\u00abexaminer les derniers d\u00e9veloppements li\u00e9s au processus diplomatique\u00bb_,selon Tasnim, une autre agence iranienne. Pas de date confirm\u00e9e \u00e0 ce stade par T\u00e9h\u00e9ran Donald Trump a affirm\u00e9 que les Etats-Unis signeraient dimanche un accord avec l\u2019Iran pour mettre fin \u00e0 la guerre au Moyen-Orient. Le pr\u00e9sident am\u00e9ricain, qui a d\u00e9j\u00e0 annonc\u00e9 de nombreuses fois qu\u2019un accord \u00e9tait imminent sans que ce dernier se concr\u00e9tise, a assur\u00e9 que la signature \u00e9tait _\u00abpr\u00e9vue\u00bb_ pour dimanche, jour de ses 80 ans. Une date non confirm\u00e9e \u00e0 ce stade par T\u00e9h\u00e9ran : la diplomatie iranienne a, de son c\u00f4t\u00e9, \u00e9voqu\u00e9 samedi un accord dans _\u00ables prochains jours\u00bb_ mais pas dimanche, selon l\u2019agence de presse gouvernementale IRNA. Le 13/06 \u00e0 22:25 Iran En Iran, une manifestation contre le chef de la diplomatie rapport\u00e9e par un m\u00e9dia officiel Une agence de presse iranienne a diffus\u00e9, samedi soir, une vid\u00e9o de manifestants scandant des slogans appelant \u00e0 la d\u00e9mission du ministre des affaires \u00e9trang\u00e8res, Abbas Araghtchi, dans la ville sainte de Machhad (Nord-Est), au moment o\u00f9 un accord de paix avec les Etats-Unis semble imminent. Des dizaines de personnes, dont de nombreuses femmes, se sont rassembl\u00e9es devant un b\u00e2timent du minist\u00e8re des affaires \u00e9trang\u00e8res, selon cette vid\u00e9o diffus\u00e9e par l\u2019agence Fars. _\u00abMort au d\u00e9shonorant Araghtchi, l\u2019infiltr\u00e9\u00bb_, ont lanc\u00e9 des femmes v\u00eatues de tchadors noirs, en brandissant des drapeaux iraniens, mais aussi rouge et noir, selon ces images. Vendredi, M.Araghtchi \u00e9tait apparu \u00e0 la t\u00e9l\u00e9vision iranienne afin d\u2019\u00e9voquer un possible accord avec les Etats-Unis pour mettre fin \u00e0 la guerre au Moyen-Orient. La possibilit\u00e9 de la signature d\u2019un accord-cadre a suscit\u00e9 l\u2019opposition de dirigeants iraniens conservateurs, hostiles \u00e0 des concessions, notamment sur le contr\u00f4le du strat\u00e9gique d\u00e9troit d\u2019Ormuz, de facto bloqu\u00e9 par la R\u00e9publique islamique depuis le d\u00e9but des hostilit\u00e9s. Samedi, le quotidien conservateur Kayhan a ainsi affirm\u00e9 que l\u2019Iran devait garder le contr\u00f4le du d\u00e9troit, _\u00abla plus grande faiblesse de l\u2019ennemi\u00bb_. Le 13/06 \u00e0 22:00 Liban L\u2019arm\u00e9e libanaise s\u2019est retir\u00e9e d\u2019une base militaire dans le sud du Liban face aux avanc\u00e9es isra\u00e9liennes, selon AP L\u2019arm\u00e9e libanaise a retir\u00e9, samedi, ses troupes de la caserne de Kfar Tebnit, une base situ\u00e9e dans un village du sud du Liban, apr\u00e8s l\u2019avanc\u00e9e de soldats isra\u00e9liens dans une zone \u00e0 proximit\u00e9, a d\u00e9clar\u00e9 un haut responsable militaire libanais \u00e0 l\u2019agence Associated Press. Ce d\u00e9part est intervenu alors que l\u2019arm\u00e9e isra\u00e9lienne \u00e9mettait un ordre d\u2019\u00e9vacuation pour une vingtaine de localit\u00e9s, dont la ville m\u00e9ridionale de Nabatiy\u00e9 et les villages environnants. Les troupes isra\u00e9liennes tentaient vraisemblablement de s\u2019emparer de la colline strat\u00e9gique d\u2019Ali Taher, situ\u00e9e \u00e0 la lisi\u00e8re de Kfar Tebnit, qui surplombe une grande partie de Nabatiy\u00e9 ainsi que certaines routes reliant la ville aux villages voisins. Les forces isra\u00e9liennes avaient occup\u00e9 cette colline d\u2019Ali Taher pendant dix-huit ans, jusqu\u2019\u00e0 leur retrait du Liban en mai 2000. Rest\u00e9e \u00e0 l\u2019\u00e9cart du conflit, l\u2019arm\u00e9e libanaise a aussi annonc\u00e9, samedi, qu\u2019un de ses soldats avait \u00e9t\u00e9 _\u00abgri\u00e8vement bless\u00e9\u00bb_ apr\u00e8s avoir \u00e9t\u00e9 vis\u00e9 par _\u00abun drone isra\u00e9lien\u00bb_, sur une route reliant Kfar Remman \u00e0 Nabatiy\u00e9. Le 13/06 \u00e0 21:00 L\u2019essentiel Le point sur la situation, samedi 13 juin \u00e0 21 heures *   **Donald Trump a affirm\u00e9 que la signature du protocole d\u2019accord avec l\u2019Iran \u00e9tait _\u00abpr\u00e9vue\u00bb_ pour dimanche.**_\u00abEt d\u00e8s qu\u2019il le sera, le d\u00e9troit d\u2019Ormuz sera OUVERT \u00c0 TOUS\u00bb_, a-t-il ajout\u00e9 sur son r\u00e9seau Truth Social. *   Plus t\u00f4t dans la journ\u00e9e, **Shehbaz Sharif, le premier ministre du Pakistan, pays m\u00e9diateur, avait aussi annonc\u00e9 que la signature pourrait avoir lieu dans les vingt-quatre heures**. *   Cependant, le porte-parole de la diplomatie iranienne, Esmaeil Baghaei, a d\u00e9clar\u00e9 samedi que les responsables iraniens n\u2019avaient _\u00abaucun projet de voyage \u00e0 Gen\u00e8ve ou ailleurs dans un ou deux jours\u00bb_, et que **la signature d\u2019un accord-cadre n\u2019aurait pas lieu dimanche, mais plut\u00f4t dans _\u00ables prochains jours\u00bb_**. *   **Les Etats-Unis iront r\u00e9cup\u00e9rer l\u2019uranium enrichi en Iran _\u00abau moment opportun\u00bb_, a aussi soutenu Donald Trump** sur son r\u00e9seau Truth Social. *   **Donald Trump \u00e9voquera le d\u00e9minage du d\u00e9troit d\u2019Ormuz avec ses alli\u00e9s du G7**pendant le sommet \u00e0 Evian entre lundi et mercredi, selon un haut responsable am\u00e9ricain. *   **Isra\u00ebl a continu\u00e9 de bombarder le sud du Liban, samedi, apr\u00e8s deux appels isra\u00e9liens \u00e0 \u00e9vacuer 24 localit\u00e9s** de la r\u00e9gion. L\u2019arm\u00e9e isra\u00e9lienne a affirm\u00e9 avoir bombard\u00e9 plus de 70 sites du Hezbollah dans le sud du pays au cours des derni\u00e8res 24 heures, tandis que le Hezbollah a revendiqu\u00e9 des attaques de drones contre des v\u00e9hicules militaires isra\u00e9liens. *   **Le bilan de la guerre au Liban est de 3 756 morts et 11 632 bless\u00e9s depuis le 2 mars**, selon le minist\u00e8re de la sant\u00e9 libanais. Le 13/06 \u00e0 19:51 Iran La diplomatie iranienne n\u2019a \u00abaucun projet de voyage \u00e0 Gen\u00e8ve\u00bb dimanche ou lundi, souligne son porte-parole Alors que le doute plane sur la temporalit\u00e9 de la signature d\u2019un protocole d\u2019accord entre les Etats-Unis et l\u2019Iran, le porte-parole du minist\u00e8re des affaires \u00e9trang\u00e8res iranien, Esmaeil Baghaei, a d\u00e9clar\u00e9 samedi que la diplomatie iranienne n\u2019avait _\u00abaucun projet de voyage \u00e0 Gen\u00e8ve ou ailleurs dans les deux jours \u00e0 venir\u00bb_, selon la t\u00e9l\u00e9vision d\u2019Etat. Il faut cependant noter que le minist\u00e8re des affaires \u00e9trang\u00e8res pakistanais a \u00e9voqu\u00e9 samedi une _\u00abc\u00e9r\u00e9monie de signature \u00e9lectronique\u00bb_ pr\u00e9vue pour dimanche, qui n\u2019impliquerait pas n\u00e9cessairement de d\u00e9placement diplomatique. Plus t\u00f4t, le porte-parole de la diplomatie iranienne avait affirm\u00e9 \u00e0 l\u2019agence de presse officielle IRNA que la signature n\u2019aurait pas lieu dimanche, mais plut\u00f4t dans _\u00ables prochains jours\u00bb_. M.Baghaei a aussi r\u00e9affirm\u00e9 samedi des conditions iraniennes. \u00ab_Nous devons percevoir des redevances pour les services fournis dans le d\u00e9troit d\u2019Ormuz\u00bb_, a-t-il d\u00e9clar\u00e9, cit\u00e9 par l\u2019agence de presse iranienne Fars. _\u00abLe d\u00e9blocage des fonds iraniens gel\u00e9s fera partie int\u00e9grante de l\u2019accord\u00bb_, a-t-il aussi soutenu, en pr\u00e9cisant qu\u2019_\u00ab\u00e0 ce stade la question du nucl\u00e9aire et les questions connexes ne seraient pas abord\u00e9es\u00bb_. Les versions d\u2019un \u00e9ventuel accord donn\u00e9es par les m\u00e9dias iraniens et Washington divergent, apr\u00e8s des semaines de n\u00e9gociations laborieuses. Le 13/06 \u00e0 19:28 Iran Les Etats-Unis iront r\u00e9cup\u00e9rer l\u2019uranium enrichi en Iran \u00abau moment opportun\u00bb, dit Donald Trump Selon le pr\u00e9sident am\u00e9ricain,le protocole d\u2019accord avec l\u2019Iran, dont la signature est _\u00abpr\u00e9vue\u00bb_ pour dimanche, constitue un _\u00abmur contre l\u2019arme nucl\u00e9aire\u00bb_. _\u00abEn fait, ils ne veulent plus d\u2019arme nucl\u00e9aire, et ils n\u2019en auront pas, que ce soit par achat, d\u00e9veloppement ou toute autre forme d\u2019acquisition\u00bb_, a-t-il soutenu samedi sur son r\u00e9seau, Truth Social. Donald Trump a ensuite ajout\u00e9 qu\u2019_\u00abau moment opportun, lorsque tout sera calme\u00bb_, les Etats-Unis iraient \u00ab_r\u00e9cup\u00e9rer la poussi\u00e8re nucl\u00e9aire, enfouie profond\u00e9ment sous les puissantes montagnes de granit\u00bb,_ gr\u00e2ce aux bombardiers B-2 am\u00e9ricains. \u00ab_Nous la diluerons et la d\u00e9truirons, que ce soit en Iran ou aux Etats-Unis\u00bb_, a-t-il affirm\u00e9. Le contexte Retrouvez nos analyses, t\u00e9moignages et reportages sur la situation en Iran et au Moyen-Orient. Vous pouvez retrouver notre pr\u00e9c\u00e9dent live en cliquant sur ce lien.", "body": "", "image": "https://img.lemde.fr/2026/06/14/918/0/5500/2750/644/322/60/0/0c45682_ftp-1-gn0edchfp6l7-2026-06-14t130612z-124062008-rc2ptlaqtlxf-rtrmadp-3-iran-crisis-israel-lebanon.JPG", "url": "https://www.lemonde.fr/international/live/2026/06/14/en-direct-guerre-au-moyen-orient-l-iran-accuse-les-etats-unis-de-ne-pas-respecter-ses-engagements-apres-l-attaque-israelienne-au-liban_6701050_3210.html", "source": "Le Monde", "date": "14 juin 20 ne fois la main mise sur le butin, l'escouade doit se tirer de ce bourbier en grimpant rapidement dans un h\u00e9licopt\u00e8re fra\u00eechement command\u00e9, croisant les doigts pour ne pas tomber sous le feu ennemi. Bref, c'est un mode extraction comme le jeu vid\u00e9o sait si bien le faire, pas n'importe lequel : c'est \"l'exp\u00e9rience d'extraction ultime de Call of Duty\" comme le pr\u00e9sente Infinity Ward, l'illustre studio derri\u00e8re la franchise. Il faut dire qu'apr\u00e8s le faux pas de **MW3** et le saut dans les orties de **Black Ops 7**, le studio californien a l'obligation de ne pas d\u00e9cevoir. A priori, c'est plut\u00f4t bien parti. Preuve en est cette premi\u00e8re pr\u00e9sentation du mode DMZ, chaleureusement accueillie par les joueurs avec cinq minutes de gameplay minutieuses. On peut d'abord y voir un joueur se faire abattre par un mob, avant de voir son point de vue basculer chez l'un de ses partenaires, fa\u00e7on cam\u00e9ra embarqu\u00e9e. La coop\u00e9ration, la discr\u00e9tion et la minutie se r\u00e9v\u00e8lent \u00eatre les ma\u00eetres-mots de la survie dans un environnement ultra-hostile et exigeant, o\u00f9 quelques balles suffisent pour manger les pissenlits par la racine. On appr\u00e9cie d'ailleurs le fait que le mode ne tombe pas dans la surench\u00e8re d'ennemis : les adversaires se r\u00e9v\u00e8lent au compte-goutte, avec de jolis pics d'intensit\u00e9. Reste \u00e0 voir le r\u00e9sultat final et, \u00e9videmment, comment ce mode DMZ parviendra \u00e0 se renouveler sur la dur\u00e9e. Rendez-vous le 23 octobre sur PC, PS5, Xbox Series et Switch 2. !Image 2: Call of Duty : Warzone, c'est fini sur PS4 et Xbox One Le jeu en rapport \u00c7a vous a int\u00e9ress\u00e9 ? En voil\u00e0 encore ! *   news**Call of Duty Modern Warfare 4: les pr\u00e9commandes offriront un acc\u00e8s anticip\u00e9 \u00e0 la campagne** *   news**Le mode DMZ de Call of Duty: Modern Warfare 4 s'annonce comme un jeu \u00e0 part enti\u00e8re** *   new u milieu de la semaine, un \u00e9pisode de chaleur. Voire une vague de chaleur\"_, souligne Corentin Perrot, un pr\u00e9visionniste de l'institut m\u00e9t\u00e9orologique national. Les temp\u00e9ratures seront d'ailleurs plus \u00e9lev\u00e9es que lors de l'\u00e9pisode de chaleur fin mai. M\u00e9t\u00e9o-France retient deux crit\u00e8res pour parler d'une vague de chaleur, gr\u00e2ce \u00e0 son indicateur thermique national (ITN): cet ITN doit d\u00e9passer 23,4\u00b0C pendant trois jours cons\u00e9cutifs, dont 25,3\u00b0C lors de l'un de ces jours. L'ITN est une moyenne quotidienne des temp\u00e9ratures, aussi bien diurnes que nocturnes, de 30 stations m\u00e9t\u00e9orologiques en France m\u00e9tropolitaine. Le 26 mai, cet indicateur avait grimp\u00e9 \u00e0 24,8\u00b0C \u2013 un niveau in\u00e9dit pour un mois de mai, mais qui correspondait \u00e0 un \"\u00e9pisode\" de chaleur. Des orages attendus en fin de semaine La particularit\u00e9 de l'\u00e9pisode, voire de la vague de chaleur de juin, sera d'\u00eatre tr\u00e8s proche du solstice d'\u00e9t\u00e9, donc d'intervenir pendant les journ\u00e9es les plus longues de l'ann\u00e9e. _\"Les nuits sont courtes, ce qui limite la baisse nocturne des temp\u00e9ratures. D\u00e8s mercredi et jeudi, on va avoir des minimales de 18, 20 voire 22\u00b0C, donc un ITN qui grimpe\"_, explique Corentin Perrot. _\"L'\u00e9pisode de chaleur de fin mai \u00e9tait exceptionnel de par sa pr\u00e9cocit\u00e9. Celui-ci le sera moins. Mais ce sont des temp\u00e9ratures tr\u00e8s chaudes, bien au-dessus des normales de saison\"_, rel\u00e8ve-t-il. Jeudi, M\u00e9t\u00e9o-France pr\u00e9voit par exemple jusqu'\u00e0 38\u00b0C \u00e0 Nevers, 37\u00b0C \u00e0 Paris ou Brive, ou encore 36\u00b0C \u00e0 Lyon et 35\u00b0C \u00e0 Toulouse. La fin de l'\u00e9pisode ou de la vague de chaleur d\u00e9pendra de l'effet rafra\u00eechissant d'orages, pr\u00e9vus en fin de semaine. \u00c0 lire aussi Climat : fait-il chaud ou froid pour la saison? Comparez la m\u00e9t\u00e9o du jour \u00e0 l'historique des temp\u00e9ratures des derni\u00e8res d\u00e9cennies Selon le consensus des scientifiques, les canicules \u00e0 r\u00e9p\u00e9tition sont un marqueur sans \u00e9quivoque du r\u00e9chauffement de la plan\u00e8te, et ces vagues de chaleur sont appel\u00e9es \u00e0 encore se multiplier, s'allonger et s'intensifier. !Image 16 La Quotidienne Environnement Climat, biodiversit\u00e9... retrouvez tous les jours \u00e0 17h, l\u2019essentiel de l\u2019actualit\u00e9 environnementale s'inscrire \u00e0 la newsletter Inscription \u00e0 la newsletter !Image 18 La Quotidienne Environnement Climat, biodiversit\u00e9... retrouvez tous les jours \u00e0 17h, l\u2019essentiel de l\u2019actualit\u00e9 environnementale France T\u00e9l\u00e9visions collecte votre adresse e-mail pour vous adresser la newsletter \"La Quotidienne Environnement\". \u00c0 tout moment, vous pouvez vous d\u00e9sinscrire via le lien en bas de ces newsletters. Pour en savoir plus, consultez notre politique de confidentialit\u00e9\"). s'inscrire \u00e0 la newsletter Inscription \u00e0 la newsletter !Image 20 Merci ! Climat, biodiversit\u00e9... retrouvez tous les jours \u00e0 17h, l\u2019essentiel de l\u2019actualit\u00e9 environnementale d\u00e9couvrir toutes les newsletters (Nouvelle fen\u00eatre) Confirmer votre d\u00e9sinscription Vous \u00eates sur le point de vous d\u00e9sabonner de notre newsletter. Souhaitez-vous vraiment continuer ? Consultez la m\u00e9t\u00e9o avec franceinfo Les pr\u00e9visions m\u00e9t\u00e9o en direct pour votre ville et toute la France. !Image 21 les mots-cl\u00e9s associ\u00e9s \u00e0 cet article *   Vagues de chaleur et canicules *   \u00c9v\u00e8nements m\u00e9t\u00e9orologiques extr\u00eames Connectez-vous ou cr\u00e9ez votre espace franceinfo pour commenter. !Image 23 D\u00e9couvrez l'application franceinfo Toute l\u2019actu en direct et en continu, o\u00f9 et quand vous voulez. *   Sauvegardez vos articles \u00e0 lire plus tar dans la tech est mise en lumi\u00e8re, ainsi que les enjeux li\u00e9s \u00e0 leur pr\u00e9sence accrue dans des environnements num\u00e9riques tr\u00e8s expos\u00e9s. CV en ligne et profils professionnels sont devenus incontournables, mais ils impliquent aussi une circulation plus large des donn\u00e9es personnelles. Surfshark r\u00e9pond \u00e0 ces usages avec une solution de cybers\u00e9curit\u00e9 qui combine VPN, protection contre les traqueurs et surveillance des fuites, accessible \u00e0 partir de 2,49 \u20ac par mois. Une identit\u00e9 num\u00e9rique devenue centrale dans les parcours tech Dans les m\u00e9tiers de l\u2019ing\u00e9nierie, la visibilit\u00e9 en ligne occupe une place de plus en plus importante. Un profil LinkedIn, un CV sur une plateforme sp\u00e9cialis\u00e9e ou un portfolio de projets peuvent aujourd\u2019hui suffire \u00e0 ouvrir des opportunit\u00e9s professionnelles. Mais cette exposition continue s\u2019accompagne aussi d\u2019une circulation plus large des donn\u00e9es personnelles. Les informations partag\u00e9es en ligne peuvent \u00eatre r\u00e9cup\u00e9r\u00e9es, analys\u00e9es ou, dans certains cas, exploit\u00e9es de mani\u00e8re abusive. C\u2019est pr\u00e9cis\u00e9ment sur ce terrain que les solutions de cybers\u00e9curit\u00e9 prennent une importance particuli\u00e8re. Surfshark propose ici une approche globale, qui d\u00e9passe le simple chiffrement de connexion. Surfshark int\u00e8gre aussi des fonctionnalit\u00e9s comme Alternative ID, qui limite la circulation des informations personnelles, et un syst\u00e8me d\u2019alertes en cas de fuite de donn\u00e9es. L\u2019objectif est de permettre un meilleur contr\u00f4le de son identit\u00e9 num\u00e9rique, en particulier lors des candidatures ou des \u00e9changes professionnels. La solution prot\u00e8ge aussi la navigation contre les traqueurs et les publicit\u00e9s intrusives, limitant la collecte invisible de donn\u00e9es lors des recherches ou des inscriptions sur des plateformes techniques. Une protection compl\u00e8te pour des usages professionnels et mobiles Surfshark d\u00e9passe le cadre du VPN classique. La solution s\u2019inscrit dans une strat\u00e9gie plus compl\u00e8te de protection num\u00e9rique, couvrant les appareils, les connexions et les donn\u00e9es personnelles. Les offres incluent le blocage des publicit\u00e9s, une protection contre les logiciels malveillants et un suivi des fuites de donn\u00e9es. Le tout peut \u00eatre utilis\u00e9 sur un nombre illimit\u00e9 d\u2019appareils, ce qui correspond bien aux usages des profils tech, souvent multi-\u00e9quip\u00e9s. C\u00f4t\u00e9 prix, les offres d\u00e9butent \u00e0 2,49 \u20ac par mois, avec des variations selon les formules choisies et la dur\u00e9e d\u2019engagement. Une position tarifaire qui place Surfshark parmi les solutions accessibles du march\u00e9, tout en int\u00e9grant un ensemble d\u2019outils de s\u00e9curit\u00e9 assez large. Au final, cette approche accompagne des parcours professionnels d\u00e9sormais largement num\u00e9riques. Entre recherche d\u2019emploi, visibilit\u00e9 en ligne et gestion de projets, les talents de la tech \u00e9voluent dans un environnement o\u00f9 la protection des donn\u00e9es devient un enjeu discret mais omnipr\u00e9sent. !Image 2: Surfshark renforce la protection des donn\u00e9es personnelles et professionnelles des talents de la tech.&nbsp;Cr\u00e9dit image: Magnific Surfshark renforce la protection des donn\u00e9es personnelles et professionnelles des talents de la tech.Cr\u00e9dit image: Magnific Les tarifs mentionn\u00e9s sont indicatifs et sujets \u00e0 des variations. Futura peut recevoir une compensation lorsque nos lecteurs effectuent un achat via les liens inclus dans cet article. Votre soutien \u00e0 travers ces liens marchands contribue directement au maintien de notre contenu informatif. !Image 3: ETravelSIM propose une connexion instantan\u00e9e pour suivre les \u00e9v\u00e9nements tech en mobilit\u00e9.&nbsp;Cr\
