ed/70eb9faeac/640/360", "url": "https://france.news-pravda.com/france/2026/05/31/225723.html", "source": "Pravda France", "date": "01 Jun 2026, 19:18", "pubTs": 1780341497, "readTime": "6 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 3}, {"id": "coupe-du-monde-2026-la-fifa-revolutionne-les-regles-du-jeu-a", "cat": "general", "catLabel": "G\u00e9n\u00e9ral", "title": "Coupe du Monde 2026 : la FIFA r\u00e9volutionne les r\u00e8gles du jeu \u00e0 dix jours du coup d'envoi", "excerpt": "\u00c0 quelques jours du d\u00e9but du Mondial aux \u00c9tats-Unis, au Canada et au Mexique, la FIFA et l'IFAB ont d\u00e9voil\u00e9 de nouvelles r\u00e8gles qui vont profond\u00e9ment modifier les habitudes des joueurs, entra\u00eeneurs et arbitres.", "body": "<p>Le coup d'envoi de la 23e Coupe du monde de football sera donn\u00e9 le 11 juin 2026 aux \u00c9tats-Unis, au Mexique et au Canada. Mais avant m\u00eame le premier match, c'est un v\u00e9ritable bouleversement r\u00e9glementaire qui fait parler dans les coulisses du football mondial. La FIFA et l'IFAB (International Football Association Board) ont officialis\u00e9 une s\u00e9rie de modifications des lois du jeu qui visent principalement \u00e0 mettre fin aux tactiques dilatoires et \u00e0 acc\u00e9l\u00e9rer le rythme des rencontres.</p><p>Parmi les changements les plus marquants figure l'introduction d'un chronom\u00e8tre virtuel de cinq secondes. D\u00e8s qu'une touche ou une sortie de but est accord\u00e9e, ce d\u00e9compte s'enclenche : si le joueur ne remet pas le ballon en jeu dans les cinq secondes imparties, la possession change de camp. Plus drastique encore, un d\u00e9gagement du gardien rat\u00e9 dans ce d\u00e9lai se transforme en corner pour l'\u00e9quipe adverse. Ces mesures, inspir\u00e9es par les d\u00e9rives observ\u00e9es dans les matches \u00e0 enjeu \u00e9lev\u00e9, devraient contraindre les \u00e9quipes \u00e0 jouer plus vite.</p><p>Les remplacements font \u00e9galement l'objet de nouvelles contraintes. Si un joueur sortant met plus de dix secondes \u00e0 quitter le terrain, son rempla\u00e7ant devra patienter jusqu'\u00e0 l'arr\u00eat de jeu suivant avant de pouvoir entrer. De m\u00eame, tout joueur soign\u00e9 sur le pelouse ne pourra \u00eatre substitu\u00e9 qu'apr\u00e8s une minute de traitement \u2014 une r\u00e8gle visant \u00e0 limiter les feintes de blessure.</p><p>C\u00f4t\u00e9 discipline, Pierluigi Collina, pr\u00e9sident de la Commission des arbitres de la FIFA, a annonc\u00e9 qu'un carton rouge sanctionnera d\u00e9sormais tout joueur qui se couvrirait la bouche lors d'\u00e9changes conflictuels, afin de lutter contre les propos discriminatoires et les insultes dissimul\u00e9es. Enfin, une pause de trois minutes sera syst\u00e9matiquement observ\u00e9e \u00e0 la mi-temps de chaque rencontre. Ces nouvelles r\u00e8gles, qui seront appliqu\u00e9es pour la premi\u00e8re fois \u00e0 ce niveau, font de la Coupe du Monde 2026 un laboratoire pour le football de demain.</p>", "image": "https://picsum.photos/seed/ab4ca74b09/640/360", "url": "https://www.cnews.fr/sport/2026-06-01/coupe-du-monde-2026-voici-toutes-les-nouvelles-regles-mises-en-place-pour-la", "source": "CNews", "date": "01 Jun 2026, 19:18", "pubTs": 1780341497, "readTime": "7 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 3}, {"id": "petrole-en-hausse-marches-en-tension-les-conflits-geopolitiq", "cat": "markets", "catLabel": "March\u00e9s", "title": "P\u00e9trole en hausse, march\u00e9s en tension : les conflits g\u00e9opolitiques p\u00e8sent sur l'\u00e9conomie mondiale", "excerpt": "La reprise des hostilit\u00e9s au Liban et les incertitudes \u00e9conomiques mondiales tirent les cours du p\u00e9trole \u00e0 la hausse d\u00e9but juin 2026, ravivant les craintes inflationnistes sur les march\u00e9s financiers.", "body": "<p>Les march\u00e9s financiers s'ouvrent sur une note anxieuse en ce d\u00e9but juin 2026. La d\u00e9cision d'Isra\u00ebl d'\u00e9tendre son op\u00e9ration terrestre au Liban a imm\u00e9diatement provoqu\u00e9 une remont\u00e9e des prix du p\u00e9trole, les investisseurs redoutant une d\u00e9stabilisation plus large du Moyen-Orient. Cette sensibilit\u00e9 des march\u00e9s \u00e9nerg\u00e9tiques aux tensions g\u00e9opolitiques r\u00e9gionales illustre la fragilit\u00e9 des \u00e9quilibres \u00e9conomiques mondiaux actuels.</p><p>La corr\u00e9lation entre les conflits arm\u00e9s et les cours de l'or noir est directe : d\u00e8s que les risques de perturbation des routes d'approvisionnement ou des infrastructures p\u00e9troli\u00e8res s'accroissent dans la r\u00e9gion, les contrats \u00e0 terme sur le p\u00e9trole r\u00e9agissent. Les analystes de plusieurs grandes banques d'investissement ont relev\u00e9 leurs pr\u00e9visions de prix pour le Brent \u00e0 court terme, anticipant une volatilit\u00e9 accrue dans les semaines \u00e0 venir.</p><p>Cette hausse des prix de l'\u00e9nergie arrive \u00e0 un moment d\u00e9licat pour les \u00e9conomies occidentales. Les banques centrales, qui avaient commenc\u00e9 \u00e0 assouplir leurs politiques mon\u00e9taires \u00e0 partir de fin 2025, se trouvent \u00e0 nouveau confront\u00e9es \u00e0 des pressions inflationnistes import\u00e9es. La R\u00e9serve f\u00e9d\u00e9rale am\u00e9ricaine et la Banque centrale europ\u00e9enne surveillent de pr\u00e8s l'\u00e9volution des prix \u00e0 la consommation, sachant qu'une flamb\u00e9e de l'\u00e9nergie pourrait contraindre \u00e0 un maintien plus prolong\u00e9 de taux directeurs \u00e9lev\u00e9s.</p><p>Dans ce contexte, les march\u00e9s actions montrent des signes de prudence. Les valeurs d\u00e9fensives \u2014 \u00e9nergie, d\u00e9fense, utilities \u2014 surperforment les secteurs plus cycliques. Parall\u00e8lement, l'or, valeur refuge traditionnelle, attire de nouveaux acheteurs institutionnels. La conjonction de la pression g\u00e9opolitique au Liban, des sorties record des ETF Bitcoin et de l'incertitude sur la politique mon\u00e9taire compose un tableau peu rassurant pour les investisseurs en ce d\u00e9but de mois de juin 2026.</p>", "image": "https://picsum.photos/seed/e1c515b39c/640/360", "url": "https://www.euronews.com/business/2026/06/01/oil-prices-climb-as-israel-expands-military-operation-in-lebanon", "source": "Euronews", "date": "01 Jun 2026, 19:18", "pubTs": 1780341497, "readTime": "6 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 2}, {"id": "anthropic-ravit-a-openai-le-titre-de-start-up-d-ia-la-plus-v", "cat": "ia", "catLabel": "IA & Tech", "title": "Anthropic ravit \u00e0 OpenAI le titre de start-up d'IA la plus valoris\u00e9e avec 965 milliards de dollars", "excerpt": "Le cr\u00e9ateur de Claude atteindrait une valorisation de 965 milliards de dollars, d\u00e9passant OpenAI et redessinant la hi\u00e9rarchie de l'intelligence artificielle.", "body": "<p>Anthropic, la soci\u00e9t\u00e9 \u00e0 l'origine de l'assistant Claude, serait devenue la start-up d'intelligence artificielle la plus valoris\u00e9e au monde. Selon des informations r\u00e9v\u00e9l\u00e9es fin mai 2026, l'entreprise viserait une valorisation d'environ 965 milliards de dollars dans le cadre d'un nouveau tour de financement, un niveau qui la propulse devant son grand rival OpenAI.</p><p>Ce franchissement de seuil illustre l'app\u00e9tit toujours soutenu des investisseurs pour les acteurs de pointe de l'IA g\u00e9n\u00e9rative, malgr\u00e9 les interrogations r\u00e9currentes sur la rentabilit\u00e9 du secteur et sur le co\u00fbt colossal de l'entra\u00eenement des mod\u00e8les. En l'espace de quelques ann\u00e9es, Anthropic est pass\u00e9e du statut de jeune pousse fond\u00e9e par d'anciens cadres d'OpenAI \u00e0 celui de poids lourd capable de rivaliser avec les g\u00e9ants \u00e9tablis.</p><p>Cette ascension repose en grande partie sur le positionnement d'Anthropic aupr\u00e8s des entreprises. La soci\u00e9t\u00e9 a su s\u00e9duire un nombre croissant de clients professionnels gr\u00e2ce \u00e0 ses mod\u00e8les Claude, r\u00e9put\u00e9s pour leurs performances en programmation, en raisonnement et en traitement de t\u00e2ches complexes. La demande des grands comptes pour des outils fiables et s\u00e9curis\u00e9s a constitu\u00e9 un moteur de croissance d\u00e9terminant.</p><p>Le franchissement de la barre symbolique du quasi-billion de dollars intervient dans un contexte de concurrence f\u00e9roce. OpenAI, longtemps consid\u00e9r\u00e9 comme le leader incontest\u00e9 du secteur, voit ainsi sa primaut\u00e9 contest\u00e9e sur le terrain de la valorisation. Les deux entreprises se livrent une course effr\u00e9n\u00e9e \u00e0 l'innovation, chacune multipliant les annonces de nouveaux mod\u00e8les et de capacit\u00e9s in\u00e9dites.</p><p>Ces niveaux de valorisation vertigineux alimentent toutefois un d\u00e9bat persistant sur l'existence d'une possible bulle autour de l'intelligence artificielle. Les montants investis d\u00e9passent d\u00e9sormais ceux de nombreuses entreprises cot\u00e9es en Bourse depuis des d\u00e9cennies, alors m\u00eame que la trajectoire vers la rentabilit\u00e9 reste incertaine pour la plupart des acteurs. Les d\u00e9fenseurs du secteur estiment au contraire que l'IA repr\u00e9sente une transformation \u00e9conomique de fond, justifiant des paris financiers d'une ampleur historique.</p><p>Pour Anthropic, ce nouveau jalon renforce sa capacit\u00e9 \u00e0 financer la recherche, \u00e0 attirer les talents et \u00e0 soutenir l'infrastructure de calcul n\u00e9cessaire au d\u00e9veloppement de ses futurs mod\u00e8les. Reste \u00e0 savoir si cette position dominante en mati\u00e8re de valorisation se traduira durablement dans les usages et les revenus, dans un march\u00e9 qui \u00e9volue \u00e0 une vitesse in\u00e9dite.</p>", "image": "https://picsum.photos/seed/db9339cd52/640/360", "url": "https://www.axios.com/2026/05/28/anthropic-ai-fundraising-openai", "source": "Axios", "date": "31 May 2026, 18:54", "pubTs": 1780253643, "readTime": "8 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 2}, {"id": "google-contre-attaque-avec-gemini-3-5-flash-le-modele-omni-e", "cat": "ia", "catLabel": "IA & Tech", "title": "Google contre-attaque avec Gemini 3.5 Flash, le mod\u00e8le Omni et l'agent Gemini Spark", "excerpt": "Pour ne pas se laisser distancer par OpenAI et Anthropic, Google d\u00e9voile de nouveaux mod\u00e8les et un agent personnel capable de raisonner \u00e0 travers les applications.", "body": "<p>Google a d\u00e9voil\u00e9 une nouvelle vague de mod\u00e8les d'intelligence artificielle et d'agents personnels, dans une tentative manifeste de maintenir le rythme face \u00e0 ses rivaux OpenAI et Anthropic. Les annonces, pr\u00e9sent\u00e9es lors de la conf\u00e9rence d\u00e9veloppeurs du groupe, t\u00e9moignent de l'intensit\u00e9 de la comp\u00e9tition au sommet du secteur.</p><p>Parmi les nouveaut\u00e9s figure Gemini 3.5 Flash, une version all\u00e9g\u00e9e de la gamme Gemini. Google met en avant son rapport performance-prix : le mod\u00e8le offrirait des capacit\u00e9s de pointe \u00e0 la moiti\u00e9, voire au tiers du co\u00fbt de solutions comparables. Cette strat\u00e9gie tarifaire vise \u00e0 rendre l'IA g\u00e9n\u00e9rative plus accessible aux d\u00e9veloppeurs et aux entreprises soucieuses de ma\u00eetriser leurs d\u00e9penses, alors que les co\u00fbts d'usage tendent globalement \u00e0 augmenter dans l'industrie.</p><p>Le groupe a \u00e9galement pr\u00e9sent\u00e9 Omni, un nouveau \u00ab mod\u00e8le du monde \u00bb con\u00e7u pour simuler l'environnement physique. Cette cat\u00e9gorie de mod\u00e8les cherche \u00e0 doter les syst\u00e8mes d'IA d'une compr\u00e9hension des lois et des dynamiques du monde r\u00e9el, une brique jug\u00e9e essentielle pour les applications de robotique, de simulation et d'agents autonomes \u00e9voluant dans des contextes complexes.</p><p>Sur le front de l'IA agentique, Google a lanc\u00e9 Gemini Spark, un agent g\u00e9n\u00e9raliste int\u00e9gr\u00e9 \u00e0 l'application Gemini. Cet outil est capable de raisonner \u00e0 partir d'informations r\u00e9parties dans plusieurs applications connect\u00e9es, afin d'ex\u00e9cuter des t\u00e2ches pour le compte de l'utilisateur. Gemini Spark est propos\u00e9 en version b\u00eata, d'abord r\u00e9serv\u00e9 \u00e0 des testeurs s\u00e9lectionn\u00e9s et aux abonn\u00e9s de l'offre Google AI Ultra.</p><p>Ces annonces s'inscrivent dans une bataille de plus en plus serr\u00e9e entre les principaux laboratoires d'IA. OpenAI a r\u00e9cemment livr\u00e9 des mod\u00e8les affichant des progr\u00e8s notables en programmation agentique et en automatisation des t\u00e2ches de connaissance, tandis qu'Anthropic continue de consolider sa position aupr\u00e8s des entreprises. Chacun cherche \u00e0 imposer son \u00e9cosyst\u00e8me et \u00e0 fid\u00e9liser une base d'utilisateurs en pleine expansion.</p><p>Pour Google, l'enjeu est double : d\u00e9montrer sa capacit\u00e9 d'innovation apr\u00e8s avoir \u00e9t\u00e9 un temps per\u00e7u comme en retard, et capitaliser sur son immense base d'utilisateurs et son infrastructure pour diffuser largement ses agents. L'arriv\u00e9e d'agents personnels capables d'agir \u00e0 travers les applications pourrait, \u00e0 terme, transformer la mani\u00e8re dont des centaines de millions de personnes interagissent avec leurs services num\u00e9riques au quotidien.</p>", "image": "https://picsum.photos/seed/d8909c50fb/640/360", "url": "https://www.cnbc.com/2026/05/19/google-ai-ultra-gemini-spark-omni.html", "source": "CNBC", "date": "31 May 2026, 18:54", "pubTs": 1780253643, "readTime": "8 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 2}, {"id": "le-bitcoin-sous-pression-reflux-des-cours-sorties-massives-d", "cat": "crypto", "catLabel": "Crypto", "title": "Le bitcoin sous pression : reflux des cours, sorties massives des ETF et domination renforc\u00e9e sur l'ether", "excerpt": "Le bitcoin a ouvert autour de 73 500 dollars fin mai, plomb\u00e9 par les tensions g\u00e9opolitiques et des sorties de capitaux records sur les fonds indiciels.", "body": "<p>Le march\u00e9 des cryptomonnaies a travers\u00e9 une fin de mois de mai 2026 difficile, sous l'effet conjugu\u00e9 des incertitudes macro\u00e9conomiques et des tensions g\u00e9opolitiques. Le vendredi 29 mai, le bitcoin a ouvert autour de 73 525 dollars, en baisse de 1,1 % par rapport \u00e0 la veille, tandis que l'ether d\u00e9butait la s\u00e9ance \u00e0 environ 2 007 dollars, en recul de 0,7 %.</p><p>Ces niveaux traduisent une phase de consolidation, voire de repli, apr\u00e8s les sommets atteints plus t\u00f4t dans l'ann\u00e9e. Les op\u00e9rateurs pointent un climat d'aversion au risque aliment\u00e9 par les craintes li\u00e9es \u00e0 la situation au Moyen-Orient et par l'attentisme autour de la politique mon\u00e9taire am\u00e9ricaine. Les actifs num\u00e9riques, souvent corr\u00e9l\u00e9s aux mouvements des march\u00e9s actions, ont suivi le ton prudent de l'ensemble des places financi\u00e8res.</p><p>L'un des faits marquants de la p\u00e9riode concerne les fonds indiciels cot\u00e9s (ETF) adoss\u00e9s aux cryptomonnaies. Les sorties hebdomadaires ont d\u00e9pass\u00e9 1,2 milliard de dollars \u00e0 la mi-mai et fin mai, le plus fort niveau depuis la fin du mois de janvier. Entre le 20 et le 29 mai, les fonds bitcoin et ether ont perdu pr\u00e8s de 2 milliards de dollars combin\u00e9s, tandis que les produits adoss\u00e9s au XRP ont, \u00e0 l'inverse, attir\u00e9 quelque 35 millions de dollars.</p><p>Autre signal notable, le rapport entre l'ether et le bitcoin a touch\u00e9 son plus bas niveau de l'ann\u00e9e, autour de 0,027 le 21 mai. Cette dynamique illustre une pr\u00e9f\u00e9rence persistante des investisseurs institutionnels pour le bitcoin au d\u00e9triment de l'ether. Plusieurs analyses publi\u00e9es au cours du mois ont d'ailleurs soulign\u00e9 la surperformance relative du bitcoin sur le reste du march\u00e9.</p><p>Les facteurs g\u00e9opolitiques ont jou\u00e9 un r\u00f4le central dans ces mouvements. Les cours ont ouvert au plus bas de la semaine avant que ne se dessine la perspective d'une rotation \u00e0 la hausse, \u00e0 la faveur d'informations \u00e9voquant une possible prolongation de tr\u00eave avec l'Iran. Cette sensibilit\u00e9 extr\u00eame aux nouvelles internationales confirme \u00e0 quel point les cryptomonnaies restent perm\u00e9ables au contexte mondial.</p><p>\u00c0 court terme, les acteurs du secteur surveillent de pr\u00e8s l'\u00e9volution des flux sur les ETF, consid\u00e9r\u00e9s comme un barom\u00e8tre de l'app\u00e9tit institutionnel. Une stabilisation, voire un retour des entr\u00e9es de capitaux, serait per\u00e7u comme un signe de regain de confiance, alors que le march\u00e9 cherche un nouveau point d'\u00e9quilibre.</p>", "image": "https://picsum.photos/seed/c5579ba2ad/640/360", "url": "https://finance.yahoo.com/personal-finance/investing/article/bitcoin-and-ethereum-prices-today-friday-may-29-2026-prices-open-lower-despite-news-of-us-iran-truce-115046286.html", "source": "Yahoo Finance", "date": "31 May 2026, 18:54", "pubTs": 1780253643, "readTime": "8 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 2}, {"id": "wall-street-enchaine-une-neuvieme-semaine-de-hausse-portee-p", "cat": "markets", "catLabel": "March\u00e9s", "title": "Wall Street encha\u00eene une neuvi\u00e8me semaine de hausse, port\u00e9e par l'IA et l'apaisement g\u00e9opolitique", "excerpt": "Le S&P 500 signe sa plus longue s\u00e9rie de gains hebdomadaires depuis 2023, dop\u00e9 par les espoirs de d\u00e9tente avec l'Iran et un bond spectaculaire de Dell.", "body": "<p>Les march\u00e9s am\u00e9ricains ont cl\u00f4tur\u00e9 la semaine du 29 mai 2026 sur une note positive, prolongeant une dynamique haussi\u00e8re remarquable. Ce jour-l\u00e0, l'indice S&P 500 a progress\u00e9 de 0,22 % pour s'\u00e9tablir \u00e0 7 580,06 points, tandis que le Dow Jones gagnait 363,49 points, soit 0,72 %, \u00e0 51 032,46 points. Le S&P 500 a ainsi sign\u00e9 sa neuvi\u00e8me semaine cons\u00e9cutive de gains, sa plus longue s\u00e9rie depuis 2023.</p><p>Cette performance s'explique par une combinaison de facteurs favorables. Au premier rang figure l'apaisement des tensions g\u00e9opolitiques : les march\u00e9s ont \u00e9t\u00e9 soutenus par l'annonce d'un m\u00e9morandum d'entente de 60 jours entre n\u00e9gociateurs am\u00e9ricains et iraniens, cens\u00e9 permettre la r\u00e9ouverture du d\u00e9troit d'Ormuz, sous r\u00e9serve de la signature pr\u00e9sidentielle. Cette perspective a pes\u00e9 sur les cours du p\u00e9trole, en baisse d'environ 1,5 % sur la s\u00e9ance et de pr\u00e8s de 10 % sur la semaine, autour de 88 dollars le baril.</p><p>Le recul des prix de l'\u00e9nergie constitue un soulagement pour les investisseurs, qui redoutaient qu'une fermeture prolong\u00e9e du d\u00e9troit d'Ormuz n'attise l'inflation et ne complique la t\u00e2che de la R\u00e9serve f\u00e9d\u00e9rale. Cette derni\u00e8re devrait toutefois maintenir ses taux directeurs inchang\u00e9s \u00e0 court terme, les responsables mon\u00e9taires privil\u00e9giant la prudence dans un environnement encore incertain.</p><p>Le march\u00e9 a \u00e9galement \u00e9t\u00e9 galvanis\u00e9 par de solides r\u00e9sultats d'entreprises. L'action Dell Technologies a bondi de pr\u00e8s de 33 %, signant sa meilleure s\u00e9ance jamais enregistr\u00e9e, apr\u00e8s la publication de r\u00e9sultats trimestriels d\u00e9passant les attentes tant sur le chiffre d'affaires que sur les b\u00e9n\u00e9fices, assortis d'un rel\u00e8vement des pr\u00e9visions annuelles. Cette envol\u00e9e illustre l'enthousiasme persistant autour des entreprises expos\u00e9es \u00e0 la demande li\u00e9e \u00e0 l'intelligence artificielle.</p><p>La th\u00e9matique de l'IA est d'ailleurs rest\u00e9e au c\u0153ur du rallye boursier, les valeurs technologiques continuant d'alimenter l'optimisme des investisseurs. Plusieurs indices ont inscrit de nouveaux records, cl\u00f4turant le mois sur une note euphorique.</p><p>Les regards se tournent d\u00e9sormais vers l'issue des n\u00e9gociations avec l'Iran, dont l'\u00e9volution conditionnera en partie la trajectoire des march\u00e9s. Une signature de l'accord conforterait le sc\u00e9nario d'un atterrissage en douceur, tandis qu'un \u00e9chec pourrait raviver la volatilit\u00e9. Dans l'intervalle, la r\u00e9silience des indices am\u00e9ricains t\u00e9moigne de la confiance des investisseurs dans la solidit\u00e9 de l'\u00e9conomie et des b\u00e9n\u00e9fices des entreprises.</p>", "image": "https://picsum.photos/seed/d4d3e999a3/640/360", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-may-29-2026", "source": "TheStreet", "date": "31 May 2026, 18:54", "pubTs": 1780253643, "readTime": "8 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 2}, {"id": "detroit-d-ormuz-la-treve-entre-washington-et-teheran-a-l-epr", "cat": "general", "catLabel": "G\u00e9n\u00e9ral", "title": "D\u00e9troit d'Ormuz : la tr\u00eave entre Washington et T\u00e9h\u00e9ran \u00e0 l'\u00e9preuve des exigences de Trump", "excerpt": "Un accord de cessez-le-feu durable semblait \u00e0 port\u00e9e de main, mais de nouvelles demandes am\u00e9ricaines ravivent les tensions autour du d\u00e9troit strat\u00e9gique.", "body": "<p>La fragile tr\u00eave entre les \u00c9tats-Unis et l'Iran a \u00e9t\u00e9 mise \u00e0 rude \u00e9preuve fin mai 2026, faisant planer le risque d'une reprise du conflit autour du d\u00e9troit d'Ormuz, voie maritime parmi les plus strat\u00e9giques de la plan\u00e8te. Apr\u00e8s l'annonce d'un accord de principe, les tensions sont rapidement remont\u00e9es.</p><p>Selon des responsables am\u00e9ricains, T\u00e9h\u00e9ran et Washington \u00e9taient parvenus \u00e0 un accord provisoire visant \u00e0 transformer le cessez-le-feu existant en un r\u00e8glement plus durable. Mais le vendredi, le pr\u00e9sident Donald Trump a formul\u00e9 une s\u00e9rie d'exigences portant sur le d\u00e9troit d'Ormuz, le programme nucl\u00e9aire iranien et le d\u00e9gel d'avoirs iraniens d\u00e9tenus \u00e0 l'\u00e9tranger. Ces demandes ont \u00e9t\u00e9 mal accueillies \u00e0 T\u00e9h\u00e9ran, et le m\u00e9morandum d'entente demeure, au mieux, un travail en cours.</p><p>La r\u00e9ponse iranienne ne s'est pas fait attendre. Le 30 mai, le g\u00e9n\u00e9ral Reza\u00ef, des Gardiens de la r\u00e9volution, a d\u00e9clar\u00e9 que l'Iran \u00e9tait pr\u00eat \u00e0 attaquer pour imposer un blocus si Trump trahissait les n\u00e9gociations. En parall\u00e8le, l'adjoint au directeur de cabinet de la Maison-Blanche, Stephen Miller, a affirm\u00e9 que le r\u00e9gime iranien avait consenti d'importantes concessions, notamment la r\u00e9ouverture du d\u00e9troit.</p><p>Sur le plan militaire, l'arm\u00e9e am\u00e9ricaine se dit pr\u00eate \u00e0 reprendre les combats dans le Golfe si n\u00e9cessaire. Le secr\u00e9taire \u00e0 la D\u00e9fense, Pete Hegseth, a assur\u00e9 que les forces am\u00e9ricaines \u00e9taient d\u00e9sormais mieux positionn\u00e9es pour intervenir qu'au premier jour du conflit. Cette posture t\u00e9moigne de la d\u00e9fiance persistante entre les deux capitales, malgr\u00e9 les avanc\u00e9es diplomatiques affich\u00e9es.</p><p>Le d\u00e9troit d'Ormuz rev\u00eat une importance capitale pour l'\u00e9conomie mondiale : une part consid\u00e9rable du p\u00e9trole export\u00e9 par voie maritime y transite. Toute perturbation de ce passage fait imm\u00e9diatement grimper les cours de l'\u00e9nergie et nourrit les craintes inflationnistes \u00e0 l'\u00e9chelle plan\u00e9taire. C'est pr\u00e9cis\u00e9ment l'espoir de sa r\u00e9ouverture qui a soutenu les march\u00e9s financiers au cours de la semaine.</p><p>La situation reste suspendue \u00e0 un \u00e9quilibre pr\u00e9caire. Les deux camps se trouvent \u00e0 un moment charni\u00e8re des n\u00e9gociations, partag\u00e9s entre la volont\u00e9 d'\u00e9viter une escalade co\u00fbteuse et la d\u00e9fense d'int\u00e9r\u00eats jug\u00e9s vitaux. La communaut\u00e9 internationale observe avec attention, consciente que l'\u00e9volution du dossier pourrait avoir des r\u00e9percussions bien au-del\u00e0 du Golfe, sur les prix de l'\u00e9nergie et la stabilit\u00e9 \u00e9conomique mondiale.</p>", "image": "https://picsum.photos/seed/d4d0679376/640/360", "url": "https://edition.cnn.com/2026/05/29/world/live-news/iran-trump-war-news", "source": "CNN", "date": "31 May 2026, 18:54", "pubTs": 1780253643, "readTime": "8 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 2}, {"id": "fin-mai-sous-le-signe-des-blockbusters-007-first-light-et-fo", "cat": "gaming", "catLabel": "Jeux Vid\u00e9o", "title": "Fin mai sous le signe des blockbusters : 007 First Light et Forza Horizon 6 enflamment le calendrier", "excerpt": "Le retour de James Bond en jeu vid\u00e9o et la nouvelle it\u00e9ration de la saga de course de Microsoft dominent une fin de mois 2026 particuli\u00e8rement charg\u00e9e.", "body": "<p>La fin du mois de mai 2026 a offert aux joueurs un calendrier de sorties particuli\u00e8rement dense, marqu\u00e9 par plusieurs lancements tr\u00e8s attendus sur consoles et PC. En t\u00eate d'affiche figure 007 First Light, sorti le 27 mai, qui marque une nouvelle tentative ambitieuse de ramener l'embl\u00e9matique espion britannique sur le devant de la sc\u00e8ne du jeu vid\u00e9o AAA.</p><p>Ce titre consacr\u00e9 \u00e0 James Bond suscitait de fortes attentes. Apr\u00e8s plusieurs ann\u00e9es sans adaptation majeure de la franchise, les studios esp\u00e8rent renouer avec l'\u00e2ge d'or des jeux d'espionnage et proposer une exp\u00e9rience \u00e0 la hauteur de l'aura cin\u00e9matographique du personnage. L'enjeu est de taille : redonner ses lettres de noblesse \u00e0 une licence dont le potentiel ludique reste consid\u00e9rable.</p><p>Autre poids lourd de la p\u00e9riode, Forza Horizon 6 a \u00e9t\u00e9 lanc\u00e9 le 18 mai. La s\u00e9rie phare de course en monde ouvert de Microsoft fait son retour avec des attentes au plus haut, port\u00e9es par le succ\u00e8s de l'\u00e9pisode pr\u00e9c\u00e9dent. Les premiers aper\u00e7us \u00e9voquent des syst\u00e8mes multijoueurs enrichis, une carte du monde agrandie et un accent renforc\u00e9 sur les \u00e9v\u00e9nements saisonniers en direct, positionnant le titre parmi les plus grosses exclusivit\u00e9s de l'ann\u00e9e.</p><p>Le reste du calendrier de fin mai s'est r\u00e9v\u00e9l\u00e9 vari\u00e9. Le 22 mai, LEGO Batman : Legacy of the Dark Knight a ramen\u00e9 le Chevalier noir dans l'univers LEGO, dans ce qui s'annonce comme l'un des plus gros lancements familiaux du mois. De son c\u00f4t\u00e9, Life Below, arriv\u00e9 le 26 mai, m\u00eale narration environnementale et m\u00e9caniques de gestion, en proposant aux joueurs de b\u00e2tir et pr\u00e9server des \u00e9cosyst\u00e8mes sous-marins dans un oc\u00e9an en mutation.</p><p>Les amateurs d'horreur n'ont pas \u00e9t\u00e9 oubli\u00e9s : le Bendy Double Pack, paru le 29 mai, regroupe plusieurs \u00e9pisodes de la franchise culte au sein d'un m\u00eame ensemble, con\u00e7u pour faire d\u00e9couvrir aux nouveaux venus son esth\u00e9tique singuli\u00e8re d'encre et de dessin anim\u00e9, ainsi que son gameplay m\u00ealant \u00e9nigmes et frissons.</p><p>Cette densit\u00e9 de sorties illustre la vitalit\u00e9 de l'industrie du jeu vid\u00e9o en 2026, qui multiplie les propositions allant du blockbuster international au titre plus intimiste. Pour les joueurs, l'embarras du choix est total, entre licences prestigieuses, exp\u00e9riences familiales et cr\u00e9ations plus originales. Une effervescence qui confirme la place centrale du jeu vid\u00e9o dans le paysage du divertissement.</p>", "image": "https://picsum.photos/seed/5fca6c97ca/640/360", "url": "https://www.dlcompare.com/gaming-news/this-week-s-video-game-releases-may-2026-week-22", "source": "DLCompare", "date": "31 May 2026, 18:54", "pubTs": 1780253643, "readTime": "8 min", "reliability": "strong", "reliabilityLabel": "\u2713 Consensus fort", "verifiedSources": 2}, {"id": "la-prochaine-mise-jour-majeure-de-factorio-sera", "cat": "gaming", "catLabel": "Jeux Vid\u00e9o", "title": "La prochaine mise \u00e0 jour majeure de Factorio sera \u00e9galement la derni\u00e8re, car son d\u00e9veloppeur annonce qu'il a \u00ab\u00a0atteint un bon endroit pour conclure le d\u00e9veloppement de gameplay actif\u00a0\u00bb", "excerpt": "Wube Software se concentrera sur le \u00ab\u00a0support \u00e0 long terme\u00a0\u00bb apr\u00e8s la mise \u00e0 jour 2.1.", "body": "", "image": "https://cdn.mos.cms.futurecdn.net/PaBtyPJk9XBFj4VhY8JmsK-1280-80.jpg", "url": "https://www.pcgamer.com/games/sim/factorios-next-major-update-will-also-be-its-last-as-its-developer-announces-it-has-reached-a-good-place-to-conclude-active-gameplay-development/", "source": "PC Gamer", "date": "31 May 2026, 13:54", "pubTs": 1780235656, "readTime": "2 min", "reliability": "moderate", "reliabilityLabel": "~ Source unique", "verifiedSources": 1}, {"id": "un-m-t-ore-a-explos-au-large-de-boston", "cat": "ia", "catLabel": "IA & Tech", "title": "Un m\u00e9t\u00e9ore a explos\u00e9 au large de Boston", "excerpt": "Samedi, vers 14h06 HE, un m\u00e9t\u00e9ore a travers\u00e9 le nord-est des \u00c9tats-Unis et a explos\u00e9 au nord de Cape Cod Bay. La boule de feu a \u00e9t\u00e9 prise en photo par plusieurs personnes, a secou\u00e9 des maisons et peut m\u00eame \u00eatre clairement vue dans l'imagerie satellite, \u00e9clairant le ciel. Certains r\u00e9sidents pensaient initialement que les secousses et le boom [\u2026]", "body": "", "image": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/05/Scre const CAT_LABELS = {all:'Toutes les actualites',ia:'IA & Tech',crypto:'Crypto',gaming:'Jeux Video',markets:'Marches',general:'General',science:'Science',dev:'Developpement',startups:'Startups',bookmarks:'Sauvegardes',search:'Recherche'};
let cat='all', curId=null, viewMode='grid', searchTerm='';
let bm=[];
try{bm=JSON.parse(localStorage.getItem('tf_bm')||'[]')}catch(e){}
try{viewMode=localStorage.getItem('tf_view')||'grid'}catch(e){}
const saveBm=()=>{try{localStorage.setItem('tf_bm',JSON.stringify(bm))}catch(e){}};
const isBm=id=>bm.includes(id);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function setView(v){
  viewMode=v;
  try{localStorage.setItem('tf_view',v)}catch(e){}
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  const fc=document.getElementById('feed');
  if(fc) fc.className='feed-col'+(v==='list'?' list':'');
}

function toggleBm(id,e){
  if(e)e.stopPropagation();
  isBm(id)?bm=bm.filter(x=>x!==id):bm.push(id);
  saveBm();
  document.querySelectorAll(`[data-bmid="${id}"]`).forEach(b=>b.classList.toggle('on',isBm(id)));
  if(curId===id){
    const pb=document.getElementById('panelBm');
    if(pb){pb.classList.toggle('on',isBm(id));pb.textContent=isBm(id)?'Sauvegarde':'Sauvegarder';}
  }
}

function showTab(c,el){
  cat=c; searchTerm='';
  const si=document.getElementById('searchInput'); if(si) si.value='';
  const sc=document.getElementById('searchClear'); if(sc) sc.classList.remove('on');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  else{const bt=document.getElementById('bmTab');if(bt)bt.classList.add('active');}
  closePanel();render();
}

function searchArticles(q){
  searchTerm=q.trim().toLowerCase();
  const sc=document.getElementById('searchClear'); if(sc) sc.classList.toggle('on',searchTerm.length>0);
  if(searchTerm.length>0){
    cat='search';
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    closePanel(); render();
  } else if(cat==='search'){
    cat='all';
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelector('.tab').classList.add('active');
    closePanel(); render();
  }
}

function render(){
  const fc=document.getElementById('feed');if(!fc)return;
  if(cat==='bookmarks'){renderBm(fc);return;}
  if(cat==='search'){renderSearch(fc);return;}
  const list=(cat==='all'?ARTICLES:ARTICLES.filter(a=>a.cat===cat)).slice().sort((a,b)=>(b.pubTs||0)-(a.pubTs||0));
  const feat=cat==='all'&&viewMode==='grid'?list[0]:null;
  const rest=feat?list.slice(1):list;
  let out=`<div class="sec-label">${CAT_LABELS[cat]} &mdash; ${list.length} article${list.length!==1?'s':''}</div>`;
  if(feat)out+=heroHTML(feat);
  out+=`<div class="grid">${rest.map(cardHTML).join('')}</div>`;
  fc.innerHTML=out;
}

function renderSearch(fc){
  const found=ARTICLES.filter(a=>{
    const t=(a.title+' '+a.excerpt+' '+a.source+' '+a.catLabel).toLowerCase();
    return t.includes(searchTerm);
  }).slice().sort((a,b)=>(b.pubTs||0)-(a.pubTs||0));
  let out=`<div class="sec-label">Recherche &mdash; ${found.length} resultat${found.length!==1?'s':''} pour "${esc(searchTerm)}"</div>`;
  if(found.length){
    out+=`<div class="grid">${found.map(cardHTML).join('')}</div>`;
  }else{
    out+=`<div class="bm-empty">Aucun article ne correspond a votre recherche.</div>`;
  }
  fc.innerHTML=out;
}

function heroHTML(a){
  const active=curId===a.id?' active-card':'';
  const bmc=isBm(a.id)?'bm-btn on':'bm-btn';
  return `<div class="hero${active}" onclick="openPanel('${a.id}')">
    <div class="hero-body">
      <div class="hero-kicker">A la une</div>
      <div class="hero-title">${esc(a.title)}</div>
      <div class="hero-excerpt">${esc(a.excerpt)}</div>
      <div class="hero-foot">
        <div style="display:flex;align-items:center;gap:7px">
          <span class="badge-cat cat-${a.cat}">${a.catLabel}</span>
          <span class="rel ${a.reliability}">${a.reliabilityLabel}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="${bmc}" data-bmid="${a.id}" onclick="toggleBm('${a.id}',event)">&#128204;</button>
          <span class="card-cta">Lire &rarr;</span>
        </div>
      </div>
    </div>
    <div class="hero-img"><img src="${esc(a.image)}" alt="" loading="lazy" onerror="this.style.display='none'"></div>
  </div>`;
}

function cardHTML(a){
  const active=curId===a.id?' active-card':'';
  const bmc=isBm(a.id)?'bm-btn on':'bm-btn';
  const icons={ia:'&#129302;',crypto:'&#8383;',gaming:'&#127918;',markets:'&#128200;',general:'&#127758;',science:'&#128300;',dev:'&#128187;',startups:'&#128640;'};
  return `<div class="card${active}" onclick="openPanel('${a.id}')">
    <div class="card-img"><img src="${esc(a.image)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="img-fb" style="display:none">${icons[a.cat]||'&#128240;'}</div></div>
    <div class="card-body">
      <div class="card-top">
        <span class="badge-cat cat-${a.cat}">${a.catLabel}</span>
        <button class="${bmc}" data-bmid="${a.id}" onclick="toggleBm('${a.id}',event)">&#128204;</button>
      </div>
      <div class="card-title">${esc(a.title)}</div>
      <div class="card-excerpt">${esc(a.excerpt)}</div>
      <div class="card-foot"><span class="rel ${a.reliability}">${a.reliabilityLabel}</span><span class="card-cta">Lire &rarr;</span></div>
      <div class="date-badge">${a.date}</div>
    </div>
  </div>`;

function renderBm(fc){
  const saved=ARTICLES.filter(a=>isBm(a.id));
  if(saved.length){
    fc.innerHTML=`<div class="sec-label">Sauvegardes &mdash; ${saved.length}</div><div class="grid">${saved.map(cardHTML).join('')}</div>`;
  }else{
    fc.innerHTML='<div class="sec-label">Sauvegardes &mdash; 0</div><div class="bm-empty">&#128204;<br><br>Aucun article sauvegarde.</div>';
  }
}

function openPanel(id){
  const a=ARTICLES.find(x=>x.id===id);if(!a)return;
  curId=id;
  document.querySelectorAll('.active-card').forEach(el=>el.classList.remove('active-card'));
  document.querySelectorAll(`[onclick="openPanel('${id}')"]`).forEach(el=>el.classList.add('active-card'));
  const panel=document.getElementById('panel');
  const layout=document.getElementById('layout');
  if(!panel||!layout)return;
  const content = a.body ? a.body : formatContent(a.excerpt);
  panel.innerHTML=`
    <div class="panel-topbar">
      <div class="panel-topbar-l">
        <span class="badge-cat cat-${a.cat}">${a.catLabel}</span>
        <span class="rel-tag ${a.reliability}">${a.reliabilityLabel} &mdash; ${a.verifiedSources} source${a.verifiedSources>1?'s':''}</span>
      </div>
      <div class="panel-actions">
        <button class="panel-bm${isBm(id)?' on':''}" id="panelBm" onclick="toggleBm('${id}',null)">${isBm(id)?'Sauvegarde':'Sauvegarder'}</button>
        <button class="panel-close" onclick="closePanel()">&#x2715;</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="art-hero-img"><img src="${esc(a.image)}" alt="" loading="lazy" onerror="this.style.display='none'"></div>
      <h1 class="art-title">${esc(a.title)}</h1>
      <div class="art-meta">
        <span>${a.date}</span><span>&middot;</span>
        <span>${a.readTime} de lecture</span><span>&middot;</span>
        <span>${esc(a.source)}</span>
      </div>
      <div class="art-content">${content}</div>
      <a class="read-more" href="${esc(a.url)}" target="_blank" rel="noopener">Lire l&#39;article complet &rarr;</a>
      <div class="annexes">
        <h3>Source originale</h3>
        <div class="src-item">
          <span class="src-num">[1]</span>
          <div>
            <span class="src-name">${esc(a.source)}</span>
            <a class="src-url" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a>
          </div>
        </div>
        <div class="vfoot">&#10003; Croise sur ${a.verifiedSources} source${a.verifiedSources>1?'s':''} avant publication</div>
      </div>
    </div>`;
  layout.classList.add('panel-open');
}

function formatContent(text){
  if(!text)return '';
  const sentences=text.split(/(?<=[.!?])\s+/);
  const paras=[];let cur='';
  for(const s of sentences){
    cur=cur?cur+' '+s:s;
    if(cur.length>280){paras.push(cur);cur='';}
  }
  if(cur)paras.push(cur);
  return (paras.length?paras:[text]).map(p=>`<p>${esc(p)}</p>`).join('');
}

function closePanel(){
  curId=null;
  document.getElementById('layout').classList.remove('panel-open');
  document.getElementById('panel').innerHTML='';
  document.querySelectorAll('.active-card').forEach(el=>el.classList.remove('active-card'));
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('active',b.dataset.v===viewMode));
if(viewMode==='list'){const fc=document.getElementById('feed');if(fc)fc.className='feed-col list';}
try{render();}catch(e){
  console.error(e);
  const fc=document.getElementById('feed');
  if(fc)fc.innerHTML=`<div style="padding:40px;text-align:center;color:#ef4444">Erreur: ${e.message}</div>`;
}
</script>
</body>
</html>
