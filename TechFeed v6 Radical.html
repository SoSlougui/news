<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechFeed — Magazine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf8;--card:#fff;--border:#e8e5e0;
  --text:#1a1a18;--text2:#5c5a55;--text3:#9c9890;
  --accent:#c44;--accentb:rgba(204,68,68,.06);
  --shadow:0 1px 2px rgba(0,0,0,.03),0 2px 6px rgba(0,0,0,.04);
}
.dark{
  --bg:#1c1c1e;--card:#232326;--border:#2e2e32;
  --text:#e6e4e0;--text2:#999590;--text3:#605e58;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

/* ── Top bar ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:1px solid var(--border);height:52px}
.topbar-l{display:flex;align-items:center;gap:10px}
.topbar-l h1{font-size:.95rem;font-weight:700;font-family:'Newsreader',Georgia,serif;color:var(--text);display:flex;align-items:center;gap:8px}
.topbar-l h1 span{font-size:.5rem;background:var(--accent);color:#fff;padding:3px 7px;border-radius:99px;font-weight:700;letter-spacing:.5px;font-family:'Inter',system-ui,sans-serif}
.topbar-r{display:flex;align-items:center;gap:8px}
.topbar-r button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:50%;cursor:pointer;font-size:.85rem;color:var(--text2);transition:all .2s}
.topbar-r button:hover{background:var(--card);color:var(--text)}
.topbar-r .search{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:.73rem;color:var(--text);outline:none;width:200px;font-family:inherit}
.topbar-r .search::placeholder{color:var(--text3)}
.topbar-r .search:focus{border-color:var(--accent)}

/* ── Sidebar ── */
aside{position:fixed;top:52px;left:0;bottom:0;width:56px;display:flex;flex-direction:column;align-items:center;padding-top:24px;gap:2px;border-right:1px solid var(--border);z-index:40}
aside a{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:1rem;text-decoration:none;color:var(--text3);transition:all .2s;position:relative}
aside a:hover{color:var(--text);background:var(--card)}
aside a.active{color:var(--accent);background:var(--accentb)}
aside a.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}

/* ── Main ── */
main{margin:52px 0 0 56px;padding:0}

/* Hero section */
.hero{position:relative;margin:0;overflow:hidden}
.hero img{width:100%;height:420px;object-fit:cover;display:block}
.hero-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:60px 48px 36px}
.hero-overlay .cat{font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.8);font-weight:700;margin-bottom:8px}
.hero-overlay h2{font-size:2rem;font-weight:700;line-height:1.15;color:#fff;margin-bottom:8px;max-width:700px;font-family:'Newsreader',Georgia,serif}
.hero-overlay p{font-size:.85rem;color:rgba(255,255,255,.7);line-height:1.6;max-width:600px}

/* Content area */
.content{padding:40px 48px 64px;max-width:1100px;margin:0 auto}
.date-section{margin-bottom:48px}
.date-section h3{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--text3);font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.date-section h3::after{content:'';flex:1;height:1px;background:var(--border)}

/* Article rows */
.article{display:flex;gap:24px;padding:20px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .2s}
.article:first-child{padding-top:0}
.article:hover .art-title{color:var(--accent)}
.article:last-child{border-bottom:none}
.art-img{flex:0 0 200px;height:130px;border-radius:8px;overflow:hidden}
.art-img img{width:100%;height:100%;object-fit:cover}
.art-text{flex:1;display:flex;flex-direction:column;justify-content:center}
.art-text .cat{font-size:.56rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:700;margin-bottom:4px}
.art-title{font-size:1.05rem;font-weight:700;line-height:1.25;color:var(--text);margin-bottom:4px;font-family:'Newsreader',Georgia,serif;transition:color .2s}
.art-excerpt{font-size:.78rem;color:var(--text2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-meta{font-size:.68rem;color:var(--text3);margin-top:4px}

/* Featured article — larger */
.article.featured .art-img{flex:0 0 340px;height:210px}
.article.featured .art-title{font-size:1.25rem}

/* Panel */
.panel{position:fixed;top:52px;right:0;bottom:0;width:520px;background:var(--bg);border-left:1px solid var(--border);z-index:60;transform:translateX(100%);transition:transform .3s;overflow-y:auto;display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-close{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text3);padding:4px 8px;border-radius:6px}
.panel-close:hover{background:var(--card);color:var(--text)}
.panel-body{padding:24px 28px 48px;flex:1;overflow-y:auto}
.panel-body img{width:100%;border-radius:10px;margin-bottom:24px;max-height:300px;object-fit:cover}
.panel-body h2{font-size:1.25rem;font-weight:700;line-height:1.25;color:var(--text);margin-bottom:10px;font-family:'Newsreader',Georgia,serif}
.panel-body .meta{font-size:.7rem;color:var(--text3);margin-bottom:20px}
.panel-body .body{font-size:.84rem;line-height:1.82;color:var(--text2)}
.panel-body .body p{margin-bottom:14px}
.panel-body .read{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;padding:9px 18px;border-radius:8px;font-size:.76rem;font-weight:600;text-decoration:none;margin-top:16px}
.panel-body .read:hover{opacity:.9}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:59;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}

/* Bookmarks & empty */
.bm-btn{background:none;border:none;cursor:pointer;font-size:.9rem;padding:2px 4px;border-radius:4px;color:var(--text3)}
.bm-btn.on{color:var(--accent)}
.empty{text-align:center;padding:64px;color:var(--text3)}
.empty h3{font-size:1.1rem;font-family:'Newsreader',Georgia,serif;color:var(--text2);margin-bottom:8px}

@media(max-width:900px){
  .hero img{height:300px}.hero-overlay{padding:40px 28px 24px}.hero-overlay h2{font-size:1.4rem}
  .content{padding:28px 24px 40px}.article{flex-direction:column;gap:12px}
  .art-img,.article.featured .art-img{flex:0 0 auto;height:180px}
  .panel{width:100%}
}
@media(max-width:600px){
  aside{display:none}main{margin-left:0}
  .topbar{padding:10px 16px}.topbar-r .search{width:120px}
  .hero img{height:220px}.hero-overlay{padding:24px 16px 16px}.hero-overlay h2{font-size:1.15rem}
  .content{padding:20px 16px 40px}
}
</style>
</head>
<body>
<!-- Top bar -->
<div class="topbar">
  <div class="topbar-l"><h1>TechFeed <span>MAG</span></h1></div>
  <div class="topbar-r">
    <input class="search" placeholder="Rechercher..." id="si" oninput="onSearch(this.value)">
    <button onclick="toggleTheme()" id="tb">☀</button>
  </div>
</div>

<!-- Sidebar -->
<aside id="aside"></aside>

<!-- Main -->
<main id="main"></main>

<!-- Panel -->
<div class="overlay" id="ov" onclick="closePanel()"></div>
<div class="panel" id="pn"></div>

<script>
// ── Data ──
const CATS={all:'Tout',ia:'IA & Tech',crypto:'Crypto',gaming:'Jeux Vidéo',markets:'Marchés',general:'Général',bookmarks:'Sauvegardes'};
const CATI={all:'🏠',ia:'🤖',crypto:'₿',gaming:'🎮',markets:'📈',general:'🌍',bookmarks:'📌'};
let cat='all',st='',bm=[];
try{bm=JSON.parse(localStorage.tf_bm||'[]')}catch(e){}
if(localStorage.theme==='dark')document.body.classList.add('dark');
document.getElementById('tb').textContent=document.body.classList.contains('dark')?'☾':'☀';
const sb=()=>{try{localStorage.tf_bm=JSON.stringify(bm)}catch(e){}};
const isBm=id=>bm.includes(id);
const E=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.theme=document.body.classList.contains('dark')?'dark':'light';
  document.getElementById('tb').textContent=document.body.classList.contains('dark')?'☾':'☀';
}

function toggleBm(id,e){if(e)e.stopPropagation();isBm(id)?bm=bm.filter(x=>x!==id):bm.push(id);sb();renderBmBtn(id);}
function renderBmBtn(id){
  document.querySelectorAll('[data-bmid="'+id+'"]').forEach(b=>b.classList.toggle('on',isBm(id)));
}

// ── Sidebar ──
function renderSidebar(){
  const a=document.getElementById('aside');
  a.innerHTML=Object.entries(CATI).map(([k,v])=>'<a href="#" class="'+(k===cat?'active':'')+'" onclick="setCat(\''+k+'\');return false" title="'+CATS[k]+'">'+v+'</a>').join('');
}

function setCat(c){cat=c;st='';document.getElementById('si').value='';closePanel();renderSidebar();render();}

function onSearch(v){st=v.trim().toLowerCase();cat=st?'search':'all';closePanel();renderSidebar();render();}

// ── Date label ──
function dl(ts){
  if(!ts)return'';
  const n=new Date(),d=new Date(ts*1000),df=Math.floor((n-d)/86400000);
  return df===0?'Aujourd\'hui':df===1?'Hier':df<7?'Cette semaine':d.toLocaleDateString('fr',{day:'numeric',month:'long'});
}

// ── Render ──
function render(){
  const m=document.getElementById('main');if(!m)return;
  if(cat==='bookmarks'){renderBm(m);return}
  if(cat==='search'){renderSearch(m);return}

  const list=(cat==='all'?DATA:DATA.filter(a=>a.cat===cat)).sort((a,b)=>(b.pubTs||0)-(a.pubTs||0));
  if(!list.length){m.innerHTML='<div class="empty"><h3>Aucun article</h3><p>Revenez plus tard.</p></div>';return}

  const hero=list[0];
  const rest=list.slice(1);
  const groups={};
  rest.forEach(a=>{const l=dl(a.pubTs);if(!groups[l])groups[l]=[];groups[l].push(a)});

  let h='<div class="hero" onclick="openP(\''+hero.id+'\')">'
    +'<img src="'+E(hero.image)+'" alt="" onerror="this.style.display=\'none\'">'
    +'<div class="hero-overlay">'
      +'<div class="cat">'+E(hero.catLabel)+'</div>'
      +'<h2>'+E(hero.title)+'</h2>'
      +'<p>'+E(hero.excerpt)+'</p>'
    +'</div></div>';

  h+='<div class="content">';
  for(const[l,items]of Object.entries(groups)){
    h+='<div class="date-section"><h3>'+l+'</h3>';
    items.forEach((a,i)=>{
      const bc=isBm(a.id)?'bm-btn on':'bm-btn';
      const isF=i===0&&l==='Aujourd\'hui';
      h+='<div class="article'+(isF?' featured':'')+'" onclick="openP(\''+a.id+'\')">'
        +'<div class="art-img"><img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'"></div>'
        +'<div class="art-text">'
          +'<div class="cat">'+E(a.catLabel)+'</div>'
          +'<div class="art-title">'+E(a.title)+'</div>'
          +'<div class="art-excerpt">'+E(a.excerpt)+'</div>'
          +'<div class="art-meta">'+E(a.source)+' · '+E(a.date)+' <button class="'+bc+'" data-bmid="'+a.id+'" onclick="toggleBm(\''+a.id+'\',event)" style="vertical-align:middle">📌</button></div>'
        +'</div></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  m.innerHTML=h;
}

function renderSearch(m){
  const f=DATA.filter(a=>((a.title||'')+' '+(a.excerpt||'')).toLowerCase().includes(st)).sort((a,b)=>(b.pubTs||0)-(a.pubTs||0));
  if(!f.length){m.innerHTML='<div class="empty"><h3>Aucun résultat</h3><p>pour "'+E(st)+'"</p></div>';return}
  let h='<div class="content">';
  const g={};f.forEach(a=>{const l=dl(a.pubTs);if(!g[l])g[l]=[];g[l].push(a)});
  for(const[l,i]of Object.entries(g)){
    h+='<div class="date-section"><h3>'+l+' — '+i.length+' résultat'+(i.length>1?'s':'')+'</h3>';
    i.forEach(a=>{
      const bc=isBm(a.id)?'bm-btn on':'bm-btn';
      h+='<div class="article" onclick="openP(\''+a.id+'\')">'
        +'<div class="art-img"><img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'"></div>'
        +'<div class="art-text">'
          +'<div class="cat">'+E(a.catLabel)+'</div>'
          +'<div class="art-title">'+E(a.title)+'</div>'
          +'<div class="art-excerpt">'+E(a.excerpt)+'</div>'
          +'<div class="art-meta">'+E(a.source)+' · '+E(a.date)+'</div>'
        +'</div></div>';
    });
    h+='</div>';
  }
  m.innerHTML=h+'</div>';
}

function renderBm(m){
  const s=DATA.filter(a=>isBm(a.id));
  if(!s.length){m.innerHTML='<div class="empty"><h3>📌</h3><p>Aucun article sauvegardé.</p></div>';return}
  let h='<div class="content"><div class="date-section"><h3>Sauvegardes — '+s.length+' article'+(s.length>1?'s':'')+'</h3>';
  s.forEach(a=>{
    const bc=isBm(a.id)?'bm-btn on':'bm-btn';
    h+='<div class="article" onclick="openP(\''+a.id+'\')">'
      +'<div class="art-img"><img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'"></div>'
      +'<div class="art-text">'
        +'<div class="cat">'+E(a.catLabel)+'</div>'
        +'<div class="art-title">'+E(a.title)+'</div>'
        +'<div class="art-excerpt">'+E(a.excerpt)+'</div>'
        +'<div class="art-meta">'+E(a.source)+' · '+E(a.date)+'</div>'
      +'</div></div>';
  });
  m.innerHTML=h+'</div></div>';
}

// ── Panel ──
function openP(id){
  const a=DATA.find(x=>x.id===id);if(!a)return;
  const pn=document.getElementById('pn'),ov=document.getElementById('ov');
  pn.innerHTML='<div class="panel-head">'
    +'<span class="cat">'+E(a.catLabel)+'</span>'
    +'<div style="display:flex;gap:8px">'
      +'<button class="bm-btn '+(isBm(id)?'on':'')+'" onclick="toggleBm(\''+id+'\')">📌</button>'
      +'<button class="panel-close" onclick="closePanel()">✕</button>'
    +'</div></div>'
    +'<div class="panel-body">'
      +'<img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'">'
      +'<h2>'+E(a.title)+'</h2>'
      +'<div class="meta">'+E(a.source)+' · '+E(a.date)+' · '+E(a.readTime)+' de lecture</div>'
      +'<div class="body">'+(a.body||'<p>'+E(a.excerpt)+'</p>')+'</div>'
      +'<a class="read" href="'+E(a.url)+'" target="_blank">Lire l\'article complet →</a>'
    +'</div>';
  pn.classList.add('open');ov.classList.add('show');
}
function closePanel(){document.getElementById('pn').classList.remove('open');document.getElementById('ov').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});

// ── Init ──
renderSidebar();
render();
</script>
</body>
</html>
