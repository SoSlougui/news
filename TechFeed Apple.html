<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechFeed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;-webkit-font-smoothing:antialiased}

/* ── Glass nav ── */
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:48px;background:rgba(245,245,247,.72);backdrop-filter:saturate(180%)blur(20px);-webkit-backdrop-filter:saturate(180%)blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(0,0,0,.08)}
nav h1{font-size:.85rem;font-weight:700;color:#1d1d1f;display:flex;align-items:center;gap:6px}
nav h1 span{font-size:.48rem;background:#0071e3;color:#fff;padding:2px 7px;border-radius:99px;font-weight:600;letter-spacing:.5px}
.nav-r{display:flex;align-items:center;gap:4px}
.nav-r a{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;text-decoration:none;color:#1d1d1f;font-size:.9rem;opacity:.6;transition:all .2s}
.nav-r a:hover{opacity:1;background:rgba(0,0,0,.04)}
.nav-r a.active{opacity:1;color:#0071e3}

/* ── Hero (dark section) ── */
.hero{background:#000;color:#fff;margin-top:48px;position:relative;overflow:hidden}
.hero img{width:100%;height:520px;object-fit:cover;opacity:.75}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:0 0 64px 0;max-width:900px;margin:0 auto;text-align:center}
.hero h2{font-size:3rem;font-weight:700;line-height:1.07;letter-spacing:-.28px;margin-bottom:12px}
.hero p{font-size:1.1rem;line-height:1.47;letter-spacing:-.374px;opacity:.8;max-width:600px;margin:0 auto 20px}
.hero .tag{font-size:.68rem;text-transform:uppercase;letter-spacing:2px;opacity:.6;margin-bottom:12px}

/* ── Content sections ── */
section{padding:80px 0}
section.light{background:#f5f5f7}
section.white{background:#fff}
.container{max-width:980px;margin:0 auto;padding:0 24px}
.section-head{text-align:center;margin-bottom:48px}
.section-head h3{font-size:2.5rem;font-weight:600;line-height:1.1;margin-bottom:8px;color:#1d1d1f}
.section-head p{font-size:1.06rem;line-height:1.47;color:rgba(0,0,0,.6)}

/* ── Article rows ── */
.articles{max-width:980px;margin:0 auto;padding:0 24px}
.art-row{display:flex;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid rgba(0,0,0,.06);cursor:pointer;transition:opacity .2s}
.art-row:hover{opacity:.7}
.art-row:last-child{border-bottom:none}
.art-img{flex:0 0 280px;height:180px;border-radius:12px;overflow:hidden;background:#e8e8ed}
.art-img img{width:100%;height:100%;object-fit:cover}
.art-body{flex:1;min-width:0}
.art-body .tag{font-size:.62rem;text-transform:uppercase;letter-spacing:1.5px;color:#0071e3;font-weight:600;margin-bottom:4px}
.art-body h4{font-size:1.4rem;font-weight:700;line-height:1.14;letter-spacing:.196px;color:#1d1d1f;margin-bottom:4px}
.art-body .excerpt{font-size:.94rem;line-height:1.47;color:rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-body .meta{font-size:.75rem;color:rgba(0,0,0,.4);margin-top:6px}

/* ── Featured large card ── */
.feat{background:#fff;border-radius:20px;overflow:hidden;box-shadow:rgba(0,0,0,.22)3px 5px 30px 0;margin-bottom:48px;cursor:pointer;transition:transform .3s}
.feat:hover{transform:scale(1.01)}
.feat img{width:100%;height:340px;object-fit:cover}
.feat-body{padding:32px 36px}
.feat-body .tag{font-size:.62rem;text-transform:uppercase;letter-spacing:1.5px;color:#0071e3;font-weight:600;margin-bottom:6px}
.feat-body h4{font-size:1.75rem;font-weight:700;line-height:1.14;letter-spacing:.196px;color:#1d1d1f;margin-bottom:6px}
.feat-body .excerpt{font-size:.94rem;line-height:1.47;color:rgba(0,0,0,.6)}
.feat-body .meta{font-size:.78rem;color:rgba(0,0,0,.4);margin-top:8px}

/* ── Panel ── */
.panel{position:fixed;top:48px;right:0;bottom:0;width:540px;background:#fff;z-index:200;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.15)}
.panel.open{transform:translateX(0)}
.panel-head{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%)blur(20px);-webkit-backdrop-filter:saturate(180%)blur(20px);display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid rgba(0,0,0,.06)}
.panel-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.04);border:none;cursor:pointer;font-size:1rem;color:#1d1d1f;transition:all .2s}
.panel-close:hover{background:rgba(0,0,0,.08)}
.panel-body{padding:28px 32px 64px}
.panel-body img{width:100%;border-radius:14px;margin-bottom:24px}
.panel-body h2{font-size:1.8rem;font-weight:700;line-height:1.1;letter-spacing:-.28px;color:#1d1d1f;margin-bottom:8px}
.panel-body .meta{font-size:.8rem;color:rgba(0,0,0,.48);margin-bottom:24px}
.panel-body .body{font-size:1.06rem;line-height:1.65;color:rgba(0,0,0,.8)}
.panel-body .body p{margin-bottom:16px}
.panel-body .read{display:inline-flex;align-items:center;gap:6px;background:#0071e3;color:#fff;padding:10px 20px;border-radius:980px;font-size:.88rem;font-weight:500;text-decoration:none;margin-top:20px;transition:all .2s}
.panel-body .read:hover{background:#0066cc}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199;opacity:0;pointer-events:none;transition:opacity .35s}
.overlay.show{opacity:1;pointer-events:auto}

/* ── Bookmarks ── */
.bm-star{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:2px 4px;border-radius:4px;color:rgba(0,0,0,.24);transition:all .2s;vertical-align:middle}
.bm-star.on{color:#0071e3}
.empty{text-align:center;padding:120px 24px;color:rgba(0,0,0,.4)}
.empty h3{font-size:1.5rem;font-weight:600;color:rgba(0,0,0,.6);margin-bottom:8px}

/* ── Bookmarks page ── */
.bm-page .art-row:first-child .tag{display:none}

@media(max-width:900px){
  .hero img{height:360px}.hero h2{font-size:2rem}.hero p{font-size:1rem}
  .art-row{flex-direction:column;align-items:stretch;gap:14px}.art-img{flex:0 0 auto;height:200px}
  .panel{width:100%}
  section{padding:48px 0}.section-head h3{font-size:1.8rem}
  .feat img{height:240px}.feat-body{padding:22px 24px}.feat-body h4{font-size:1.3rem}
}
@media(max-width:600px){
  .hero img{height:280px}.hero h2{font-size:1.5rem}.hero p{font-size:.9rem}
  .art-img{height:160px}.art-body h4{font-size:1.15rem}
}
</style>
</head>
<body>

<nav>
  <h1>TechFeed <span>NEWS</span></h1>
  <div class="nav-r" id="navr"></div>
</nav>

<main id="main"></main>

<div class="overlay" id="ov" onclick="closeP()"></div>
<div class="panel" id="pn"></div>

<script>
const CATS={all:'Tout',ia:'IA',crypto:'Crypto',gaming:'Jeux',markets:'Marchés',general:'Général',bookmarks:'Sauv.'};
const CATI={all:'🏠',ia:'🤖',crypto:'₿',gaming:'🎮',markets:'📈',general:'🌍',bookmarks:'📌'};
let cat='all',bm=[];
try{bm=JSON.parse(localStorage.tf||'[]')}catch(e){}
const sbm=()=>{try{localStorage.tf=JSON.stringify(bm)}catch(e){}};
const isBm=id=>bm.includes(id);
const E=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function toggleBm(id,e){if(e)e.stopPropagation();isBm(id)?bm=bm.filter(x=>x!==id):bm.push(id);sbm();document.querySelectorAll('[data-bmid="'+id+'"]').forEach(b=>b.classList.toggle('on',isBm(id)))}

// ── Nav ──
function Rnav(){
  document.getElementById('navr').innerHTML=Object.entries(CATI).map(([k,v])=>'<a href="#" class="'+(k===cat?'active':'')+'" onclick="setCat(\''+k+'\');return false" title="'+CATS[k]+'">'+v+'</a>').join('');
}
function setCat(c){cat=c;closeP();Rnav();R();}

// ── Date ──
function dl(ts){if(!ts)return'';const n=new Date(),d=new Date(ts*1000),df=Math.floor((n-d)/864e5);return df===0?'Aujourd\'hui':df===1?'Hier':df<7?'Cette semaine':d.toLocaleDateString('fr',{day:'numeric',month:'long'})}

// ── Render ──
function R(){
  const m=document.getElementById('main');if(!m)return;
  if(cat==='bookmarks'){Rbm(m);return}
  const list=(cat==='all'?DATA:DATA.filter(a=>a.cat===cat)).sort((a,b)=>(b.pubTs||0)-(a.pubTs||0));
  if(!list.length){m.innerHTML='<div class="empty"><h3>Aucun article</h3></div>';return}

  const hero=list[0],rest=list.slice(1);
  const groups={};rest.forEach(a=>{const l=dl(a.pubTs);if(!groups[l])groups[l]=[];groups[l].push(a)});

  let h='';
  // Hero
  h+='<div class="hero" onclick="openP(\''+hero.id+'\')">'
    +'<img src="'+E(hero.image)+'" alt="" onerror="this.style.display=\'none\'">'
    +'<div class="hero-content">'
      +'<div class="tag">'+E(hero.catLabel)+'</div>'
      +'<h2>'+E(hero.title)+'</h2>'
      +'<p>'+E(hero.excerpt)+'</p>'
    +'</div></div>';

  // Sections
  let isDark=false;
  for(const[l,items]of Object.entries(groups)){
    const bg=isDark?'white':'light';isDark=!isDark;
    h+='<section class="'+bg+'"><div class="container"><div class="section-head"><h3>'+l+'</h3><p>'+items.length+' article'+(items.length>1?'s':'')+'</p></div></div>';
    h+='<div class="articles">';
    items.forEach((a,i)=>{
      const bc=isBm(a.id)?'bm-star on':'bm-star';
      if(i===0&&l==='Aujourd\'hui'){
        h+='<div class="feat" onclick="openP(\''+a.id+'\')">'
          +'<img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'">'
          +'<div class="feat-body">'
            +'<div class="tag">'+E(a.catLabel)+'</div>'
            +'<h4>'+E(a.title)+'</h4>'
            +'<div class="excerpt">'+E(a.excerpt)+'</div>'
            +'<div class="meta">'+E(a.source)+' · '+E(a.date)+' <button class="'+bc+'" data-bmid="'+a.id+'" onclick="toggleBm(\''+a.id+'\',event)">☆</button></div>'
          +'</div></div>';
      }else{
        h+='<div class="art-row" onclick="openP(\''+a.id+'\')">'
          +'<div class="art-img"><img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'"></div>'
          +'<div class="art-body">'
            +'<div class="tag">'+E(a.catLabel)+'</div>'
            +'<h4>'+E(a.title)+'</h4>'
            +'<div class="excerpt">'+E(a.excerpt)+'</div>'
            +'<div class="meta">'+E(a.source)+' · '+E(a.date)+' <button class="'+bc+'" data-bmid="'+a.id+'" onclick="toggleBm(\''+a.id+'\',event)">☆</button></div>'
          +'</div></div>';
      }
    });
    h+='</div></section>';
  }
  m.innerHTML=h;
}

function Rbm(m){
  const s=DATA.filter(a=>isBm(a.id));
  if(!s.length){m.innerHTML='<div class="empty"><h3>☆</h3><p>Aucun article sauvegardé.</p></div>';return}
  let h='<section class="light"><div class="container"><div class="section-head"><h3>Sauvegardes</h3><p>'+s.length+' article'+(s.length>1?'s':'')+'</p></div></div><div class="articles">';
  s.forEach(a=>{
    const bc=isBm(a.id)?'bm-star on':'bm-star';
    h+='<div class="art-row bm-page" onclick="openP(\''+a.id+'\')">'
      +'<div class="art-img"><img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'"></div>'
      +'<div class="art-body">'
        +'<div class="tag">'+E(a.catLabel)+'</div>'
        +'<h4>'+E(a.title)+'</h4>'
        +'<div class="excerpt">'+E(a.excerpt)+'</div>'
        +'<div class="meta">'+E(a.source)+' · '+E(a.date)+'</div>'
      +'</div></div>';
  });
  m.innerHTML=h+'</div></section>';
}

// ── Panel ──
function openP(id){
  const a=DATA.find(x=>x.id===id);if(!a)return;
  const pn=document.getElementById('pn'),ov=document.getElementById('ov');
  pn.innerHTML='<div class="panel-head">'
    +'<div class="tag" style="margin:0">'+E(a.catLabel)+'</div>'
    +'<button class="panel-close" onclick="closeP()">✕</button></div>'
    +'<div class="panel-body">'
      +'<img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'">'
      +'<h2>'+E(a.title)+'</h2>'
      +'<div class="meta">'+E(a.source)+' · '+E(a.date)+' · '+E(a.readTime)+' de lecture</div>'
      +'<div class="body">'+(a.body||'<p>'+E(a.excerpt)+'</p>')+'</div>'
      +'<a class="read" href="'+E(a.url)+'" target="_blank">Lire l\'article complet →</a>'
    +'</div>';
  pn.classList.add('open');ov.classList.add('show');
}
function closeP(){document.getElementById('pn').classList.remove('open');document.getElementById('ov').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeP()});

Rnav();R();
</script>
</body>
</html>
