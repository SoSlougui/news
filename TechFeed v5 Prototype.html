<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechFeed — v5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--bgw:#faf9f7;--card:#fff;--cardh:#fafaf9;
  --border:rgba(0,0,0,.07);--text:#1a1a1a;--text2:#555;--text3:#999;
  --accent:#e04b4b;--accent2:#ff6b6b;
  --hero-bg:linear-gradient(135deg,#fef9f9,#fdf5f5);
  --radius:12px;--radius-lg:16px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --shadowh:0 4px 20px rgba(0,0,0,.08);
}
.dark{
  --bg:#161618;--bgw:#1c1c1f;--card:#1e1e22;--cardh:#232329;
  --border:rgba(255,255,255,.06);--text:#e8e8ec;--text2:#999;--text3:#666;
  --hero-bg:linear-gradient(135deg,#1c1818,#211a1a);
  --shadow:none;--shadowh:0 8px 32px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background .3s,color .3s}

header{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--bg);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:800;color:var(--text);text-decoration:none}
.logo em{font-style:normal;background:var(--accent);color:#fff;font-size:.5rem;padding:3px 7px;border-radius:99px;font-weight:700;letter-spacing:.5px}
.hr{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;background:var(--bgw);border:1px solid var(--border);border-radius:8px;padding:5px 10px;width:240px}
.search input{border:none;background:none;outline:none;font-size:.75rem;color:var(--text);width:100%;font-family:inherit}
.search input::placeholder{color:var(--text3)}
.btn-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:50%;cursor:pointer;font-size:.9rem;color:var(--text2);transition:all .2s}
.btn-icon:hover{background:var(--bgw);color:var(--text)}
.btn-ghost{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 14px;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--text2)}

.tabs{position:fixed;top:56px;left:0;right:0;z-index:49;background:var(--bg);border-bottom:1px solid var(--border);padding:0 28px;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;font-size:.73rem;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.layout{display:flex;position:fixed;top:104px;left:0;right:0;bottom:0}
.main{flex:1;overflow-y:auto;padding:32px 40px;min-width:0}
.panel{width:0;overflow:hidden;background:var(--bg);border-right:1px solid var(--border);transition:width .3s;display:flex;flex-direction:column;flex-shrink:0;order:-1}
.layout.open .panel{width:500px}

.hero{display:flex;border-radius:var(--radius-lg);overflow:hidden;background:var(--card);border:1px solid var(--border);margin-bottom:40px;cursor:pointer;min-height:300px;transition:all .3s}
.hero:hover{box-shadow:var(--shadowh)}
.hero-img{flex:0 0 55%;overflow:hidden;position:relative}
.hero-img img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.hero-body{flex:1;padding:32px 36px;display:flex;flex-direction:column;justify-content:center}
.hero-cat{font-size:.6rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:700;margin-bottom:10px}
.hero-title{font-size:1.4rem;font-weight:700;line-height:1.2;color:var(--text);margin-bottom:10px;font-family:'Newsreader',Georgia,serif}
.hero-desc{font-size:.82rem;color:var(--text2);line-height:1.6;margin-bottom:14px}
.hero-meta{display:flex;align-items:center;gap:10px;font-size:.7rem;color:var(--text3)}
.hero-cta{color:var(--accent);font-weight:600;font-size:.73rem;display:flex;align-items:center;gap:4px;margin-top:auto}

.section-label{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:var(--text3);font-weight:600;margin-bottom:18px}

.date-group{margin-bottom:36px}
.date-title{font-size:.78rem;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.date-title::after{content:'';flex:1;height:1px;background:var(--border)}
.date-count{font-weight:400;color:var(--text2);font-size:.7rem}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .25s;display:flex;flex-direction:column}
.card:hover{box-shadow:var(--shadowh);transform:translateY(-2px)}
.card-img{height:160px;overflow:hidden;flex-shrink:0;background:var(--bgw)}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:18px;flex:1;display:flex;flex-direction:column}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cat-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.cat-ia{background:rgba(59,130,246,.1);color:#2563eb}.cat-crypto{background:rgba(245,158,11,.1);color:#d97706}
.cat-gaming{background:rgba(16,185,129,.1);color:#059669}.cat-markets{background:rgba(139,92,246,.1);color:#7c3aed}
.cat-general{background:rgba(239,68,68,.1);color:#dc2626}
.card-title{font-size:.85rem;font-weight:700;line-height:1.3;color:var(--text);margin-bottom:5px;flex:1;font-family:'Newsreader',Georgia,serif}
.card-desc{font-size:.72rem;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:.66rem;color:var(--text3)}
.card-cta{color:var(--accent);font-weight:600}

.bm-btn{background:none;border:none;cursor:pointer;font-size:.9rem;padding:2px 4px;border-radius:4px;color:var(--text3);line-height:1}
.bm-btn.on{color:var(--accent)}

/* Panel */
.panel-top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:22px 26px 40px}
.art-img{border-radius:10px;overflow:hidden;margin-bottom:20px}
.art-img img{width:100%;max-height:280px;object-fit:cover}
.art-title{font-size:1.2rem;font-weight:700;line-height:1.25;color:var(--text);margin-bottom:10px;font-family:'Newsreader',Georgia,serif}
.art-meta{font-size:.7rem;color:var(--text3);margin-bottom:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.art-content{font-size:.84rem;line-height:1.8;color:var(--text2)}
.art-content p{margin-bottom:14px}
.art-link{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:.76rem;font-weight:600;cursor:pointer;text-decoration:none;margin-top:10px}
.art-link:hover{opacity:.9}
.art-sources{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.art-sources h3{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px}
.src-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.src-num{font-size:.62rem;font-weight:700;color:var(--accent);background:rgba(224,75,75,.08);padding:2px 6px;border-radius:4px;flex-shrink:0;margin-top:1px}
.src-name{font-size:.74rem;font-weight:600;color:var(--text2)}.src-url{font-size:.66rem;color:var(--accent);text-decoration:none;word-break:break-all}
.empty{text-align:center;padding:48px;color:var(--text3)}

.bm-empty{text-align:center;padding:48px;color:var(--text3)}

@media(max-width:1024px){.main{padding:24px 28px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
.hero{flex-direction:column;min-height:auto}.hero-img{flex:0 0 220px}.hero-body{padding:22px}.hero-title{font-size:1.2rem}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}.main{padding:18px}
.layout.open .panel{width:100%;position:absolute;inset:0;z-index:10}
}
@media(max-width:640px){
header{padding:0 14px;height:52px}.search{display:none}.tabs{top:52px;padding:0 8px}.tab{padding:8px 10px;font-size:.7rem}
.layout{top:96px}.main{padding:12px}.grid{grid-template-columns:1fr;gap:12px}
.hero{border-radius:12px;margin-bottom:24px}.hero-img{flex:0 0 180px}.hero-body{padding:16px 18px}
.card{flex-direction:row;height:130px}.card-img{width:130px;height:130px;flex-shrink:0}.card-body{padding:12px 14px}.card-desc{display:none}.card-title{font-size:.8rem}
}
</style>
</head>
<body>
<header>
  <a class="logo">📰 TechFeed <em>NEWS</em></a>
  <div class="hr">
    <div class="search"><input placeholder="Rechercher un article..." id="si" oninput="onSearch(this.value)"></div>
    <button class="btn-icon" onclick="toggleTheme()" id="tb">☀</button>
    <button class="btn-ghost" onclick="showTab('bookmarks',null)">📌 Sauvegardes</button>
  </div>
</header>
<div class="tabs" id="tabs">
  <div class="tab active" onclick="showTab('all',this)">Tout</div>
  <div class="tab" onclick="showTab('ia',this)">IA & Tech</div>
  <div class="tab" onclick="showTab('crypto',this)">Crypto</div>
  <div class="tab" onclick="showTab('gaming',this)">Jeux</div>
  <div class="tab" onclick="showTab('markets',this)">Marchés</div>
  <div class="tab" onclick="showTab('general',this)">Général</div>
  <div class="tab" onclick="showTab('worldcup',this)">⚽ Coupe du Monde</div>
  <div class="tab" id="bmTab" onclick="showTab('bookmarks',this)">📌 Sauvegardes</div>
</div>
<div class="layout" id="layout">
  <div class="main" id="main"></div>
  <div class="panel" id="panel"></div>
</div>

<script>
const CATS={all:'Toutes les actualités',ia:'IA & Tech',crypto:'Crypto',gaming:'Jeux Vidéo',markets:'Marchés',general:'Général',worldcup:'Coupe du Monde 2026',bookmarks:'Sauvegardes',search:'Recherche'};
let cat='all',cur=null,bm=[];
try{bm=JSON.parse(localStorage.tf_bm||'[]')}catch(e){}
if(localStorage.theme==='dark')document.body.classList.add('dark');
document.getElementById('tb').textContent=document.body.classList.contains('dark')?'☾':'☀';
const saBm=()=>{try{localStorage.tf_bm=JSON.stringify(bm)}catch(e){}};
const isBm=id=>bm.includes(id);
const E=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.theme=document.body.classList.contains('dark')?'dark':'light';
  document.getElementById('tb').textContent=document.body.classList.contains('dark')?'☾':'☀';
}

function showTab(c,el){
  cat=c;
  const si=document.getElementById('si');if(si)si.value='';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  else document.getElementById('bmTab').classList.add('active');
  closePanel();render();
}

let st='';
function onSearch(v){st=v.trim().toLowerCase();if(st){cat='search';closePanel();render()}else if(cat==='search'){cat='all';closePanel();render()}}

function toggleBm(id,e){if(e)e.stopPropagation();isBm(id)?bm=bm.filter(x=>x!==id):bm.push(id);saBm();renderBmBtn(id);}
function renderBmBtn(id){
  document.querySelectorAll('[data-bmid="'+id+'"]').forEach(b=>b.classList.toggle('on',isBm(id)));
  const pb=document.getElementById('pbm');if(pb){pb.classList.toggle('on',isBm(id));pb.textContent=isBm(id)?'★':'☆'}
}

function dl(ts){
  if(!ts)return'';
  const n=new Date(),d=new Date(ts*1000),df=Math.floor((n-d)/86400000);
  return df===0?'Aujourd\'hui':df===1?'Hier':df<7?'Cette semaine':d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
}

function gbd(list){
  const g={};
  for(const a of list){const l=dl(a.pubTs);if(!g[l])g[l]=[];g[l].push(a)}
  return g;
}

function render(){
  const m=document.getElementById('main');if(!m)return;
  if(cat==='bookmarks'){renderBm(m);return}
  if(cat==='search'){renderSearch(m);return}
  if(cat==='worldcup'){renderWC(m);return}
  const list=(cat==='all'?DATA:DATA.filter(a=>a.cat===cat)).sort((a,b)=>(b.pubTs||0)-(a.pubTs||0));
  const feat=cat==='all'?list[0]:null;
  const rest=feat?list.slice(1):list;
  let h='<div class="section-label">'+CATS[cat]+' — '+list.length+' article'+(list.length>1?'s':'')+'</div>';
  if(feat)h+=heroH(feat);
  if(rest.length){
    const gs=gbd(rest);
    for(const[l,items]of Object.entries(gs)){
      h+='<div class="date-group"><div class="date-title">'+l+'<span class="date-count">— '+items.length+' article'+(items.length>1?'s':'')+'</span></div>';
      h+='<div class="grid">'+items.map(cardH).join('')+'</div></div>';
    }
  }
  m.innerHTML=h;
}

function renderSearch(m){
  const f=DATA.filter(a=>((a.title||'')+' '+(a.excerpt||'')+' '+a.catLabel).toLowerCase().includes(st)).sort((a,b)=>(b.pubTs||0)-(a.pubTs||0));
  let h='<div class="section-label">Recherche — '+f.length+' résultat'+(f.length>1?'s':'')+' pour "'+E(st)+'"</div>';
  if(f.length){const gs=gbd(f);for(const[l,i]of Object.entries(gs)){h+='<div class="date-group"><div class="date-title">'+l+'</div><div class="grid">'+i.map(cardH).join('')+'</div></div>'}}
  else h+='<div class="empty">Aucun article trouvé.</div>';
  m.innerHTML=h;
}

function heroH(a){
  const bc=isBm(a.id)?'bm-btn on':'bm-btn';
  return '<div class="hero" onclick="openP(\''+a.id+'\')">'
    +'<div class="hero-img"><img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'"></div>'
    +'<div class="hero-body">'
      +'<div class="hero-cat">'+E(a.catLabel)+'</div>'
      +'<div class="hero-title">'+E(a.title)+'</div>'
      +'<div class="hero-desc">'+E(a.excerpt)+'</div>'
      +'<div class="hero-meta"><span>'+E(a.date)+'</span><span>·</span><span>'+E(a.source)+'</span></div>'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px">'
        +'<span class="hero-cta">Lire l\'article →</span>'
        +'<button class="'+bc+'" data-bmid="'+a.id+'" onclick="toggleBm(\''+a.id+'\',event)">📌</button>'
      +'</div>'
    +'</div></div>';
}

function cardH(a){
  const bc=isBm(a.id)?'bm-btn on':'bm-btn';
  return '<div class="card" onclick="openP(\''+a.id+'\')">'
    +'<div class="card-img"><img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'"></div>'
    +'<div class="card-body">'
      +'<div class="card-top"><span class="cat-badge cat-'+a.cat+'">'+E(a.catLabel)+'</span><button class="'+bc+'" data-bmid="'+a.id+'" onclick="toggleBm(\''+a.id+'\',event)">📌</button></div>'
      +'<div class="card-title">'+E(a.title)+'</div>'
      +'<div class="card-desc">'+E(a.excerpt)+'</div>'
      +'<div class="card-foot"><span>'+E(a.date)+'</span><span class="card-cta">Lire →</span></div>'
    +'</div></div>';
}

function renderBm(m){
  const s=DATA.filter(a=>isBm(a.id));
  if(s.length)m.innerHTML='<div class="section-label">Sauvegardes — '+s.length+'</div><div class="grid">'+s.map(cardH).join('')+'</div>';
  else m.innerHTML='<div class="bm-empty">📌<br><br>Aucun article sauvegardé.</div>';
}

function openP(id){
  const a=DATA.find(x=>x.id===id);if(!a)return;cur=id;
  const p=document.getElementById('panel'),l=document.getElementById('layout');
  if(!p||!l)return;
  p.innerHTML='<div class="panel-top">'
    +'<span class="cat-badge cat-'+a.cat+'">'+E(a.catLabel)+'</span>'
    +'<div style="display:flex;gap:8px">'
      +'<button class="btn-ghost '+(isBm(id)?'on':'')+'" id="pbm" onclick="toggleBm(\''+id+'\')">'+(isBm(id)?'★':'☆')+'</button>'
      +'<button class="btn-icon" onclick="closePanel()">✕</button>'
    +'</div></div>'
    +'<div class="panel-body">'
      +'<div class="art-img"><img src="'+E(a.image)+'" alt="" onerror="this.style.display=\'none\'"></div>'
      +'<h1 class="art-title">'+E(a.title)+'</h1>'
      +'<div class="art-meta"><span>'+E(a.date)+'</span><span>·</span><span>'+E(a.readTime)+' de lecture</span><span>·</span><span>'+E(a.source)+'</span></div>'
      +'<div class="art-content">'+(a.body||'<p>'+E(a.excerpt)+'</p>')+'</div>'
      +'<a class="art-link" href="'+E(a.url)+'" target="_blank">Lire l\'article complet →</a>'
      +'<div class="art-sources"><h3>Source</h3>'
        +'<div class="src-item"><span class="src-num">1</span><div><span class="src-name">'+E(a.source)+'</span><a class="src-url" href="'+E(a.url)+'">'+E(a.url)+'</a></div></div>'
      +'</div>'
    +'</div>';
  l.classList.add('open');
}

function closePanel(){cur=null;document.getElementById('layout').classList.remove('open');document.getElementById('panel').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});

// Coupe du Monde
function renderWC(m){
  m.innerHTML='<div class="section-label">Coupe du Monde 2026</div><div class="empty" style="padding:24px">⚽<br><br>Section Coupe du Monde — les données seront chargées par le générateur.</div>';
}

// Init
render();
</script>
</body>
</html>
