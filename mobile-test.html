<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Mobile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f5f5f7;color:#1d1d1f}
h1{padding:12px;font-size:1rem;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.art{border-bottom:1px solid #eee;padding:12px 16px}
.art h2{font-size:.95rem;margin-bottom:4px}
.art p{font-size:.8rem;color:#666}
</style>
</head>
<body>
<h1>📰 TechFeed — TEST MOBILE</h1>
<div id="articles"></div>
<script>
// Minimal inline test
var data = [
  {t:"Test article 1 — Si tu vois ceci, le JS fonctionne", s:"Source test"},
  {t:"Test article 2 — Vérification affichage mobile", s:"Source test"},
  {t:"Test article 3 — Dernier test", s:"Source test"}
];
var h = '';
data.forEach(function(a){
  h += '<div class="art"><h2>'+a.t+'</h2><p>'+a.s+'</p></div>';
});
document.getElementById('articles').innerHTML = h;
document.getElementById('articles').innerHTML += '<div class="art" style="background:#e8ffe8"><h2>✅ Page test chargée</h2><p>Si tu vois ce message, le HTML et le JS fonctionnent sur ton mobile.</p><p>Largeur écran: '+window.innerWidth+'px</p></div>';
</script>
</body>
</html>
